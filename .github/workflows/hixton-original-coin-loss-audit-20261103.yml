name: Hixton Historical Coin Realized-Loss Attribution
on:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths: [".github/workflows/hixton-original-coin-loss-audit-20261103.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-coin-contributions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Calculate executed closed-trade PnL contribution during verified original historical drawdown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data audit
          gh release download research-data-20261103-five-dot-inputs -R "$GH_REPO" -p Hixton-Loss-Handoff-20261102.zip -D data
          echo "d1d1cde8347665d74da71f9e44bb3876dc6662bfe4bfc9e34dcab1dfecd84308  data/Hixton-Loss-Handoff-20261102.zip" | sha256sum -c
          python - <<'PY'
          import collections,datetime,json,pathlib,zipfile
          from decimal import Decimal
          data=pathlib.Path("data/Hixton-Loss-Handoff-20261102.zip")
          peak=datetime.datetime.fromisoformat("2025-10-06T18:59:59.999+00:00")
          trough=datetime.datetime.fromisoformat("2026-08-18T02:59:59.999+00:00")
          report={"source":"frozen historical original Trade.json ledgers, not candidate backtests","window_start":peak.isoformat(),"window_end":trough.isoformat(),"warning":"Realized PnL from closed trades alone does NOT equal full mark-to-market HWM drawdown; position value changes, open positions, cash and fees are also necessary","cases":{},"status":"STARTED"}
          with zipfile.ZipFile(data) as z:
            paths=z.namelist()
            for cost in ("current","stress"):
              candidates=[p for p in paths if p.endswith("/baseline/original_32k/"+cost+"/Trades.json")]
              if len(candidates)!=1:raise RuntimeError("Unique original Trades ledger not found "+cost)
              trades=json.loads(z.read(candidates[0]))
              container=trades
              if isinstance(trades,dict):
                container=next((v for k,v in trades.items() if isinstance(v,list) and k.lower() in ("trades","items","records")),None)
              if not isinstance(container,list):raise RuntimeError("Unrecognized original Trades.json schema "+cost+" keys="+repr(list(trades)[:30]))
              sums=collections.defaultdict(Decimal);wins=collections.Counter();losses=collections.Counter()
              times_missing=0;rejected=0;examples=[]
              for trade in container:
                if not isinstance(trade,dict):rejected+=1;continue
                if len(examples)<2:examples.append({k:trade.get(k) for k in list(trade)[:16]})
                sym=trade.get("symbol")
                pnl=trade.get("realized_pnl")
                exit_time=trade.get("exit_time_utc")
                if sym is None or pnl is None or exit_time is None:
                  rejected+=1;continue
                try:when=datetime.datetime.fromisoformat(str(exit_time).replace("Z","+00:00"))
                except ValueError:times_missing+=1;continue
                if peak<=when<=trough:
                  p=Decimal(str(pnl));sums[sym]+=p
                  if p>=0:wins[sym]+=1
                  else:losses[sym]+=1
              result={"total_trade_records":len(container),"schema_sample":examples,"skipped_missing_required_keys":rejected,"skipped_unparsable_exit_time":times_missing,"realized_pnl_by_coin_usdc":{k:str(v) for k,v in sorted(sums.items(),key=lambda z:z[1])},"realized_closed_trade_pnl_sum_usdc":str(sum(sums.values(),Decimal(0))),"wins_by_coin":dict(wins),"losses_by_coin":dict(losses)}
              report["cases"][cost]=result
              print("COIN_REALIZED_LOSS",json.dumps({"cost":cost,"trades":len(container),"skipped":rejected,"total_realized_usdc":result["realized_closed_trade_pnl_sum_usdc"],"by_coin":result["realized_pnl_by_coin_usdc"]}),flush=True)
          report["status"]="CLOSED_TRADE_REALIZED_COIN_COMPONENTS_COMPUTED_WITH_OPEN_POSITION_LIMITATION"
          pathlib.Path("audit/coin-realized-loss-during-hwm.json").write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n")
          print("ATTRIBUTION_SUMMARY",json.dumps({"status":report["status"],"cases":list(report["cases"])}),flush=True)
          PY
      - name: Archive audit outputs without claiming full HWM attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hixton-coin-loss-evidence-${{ github.run_id }}
          path: audit/
          retention-days: 30
          if-no-files-found: warn
