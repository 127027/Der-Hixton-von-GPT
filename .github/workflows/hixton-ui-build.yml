# 2026-09-26: rebuild UI after controlled-trial entry-pause UX changes.
name: Hixton UI Build

on:
  push:
    branches:
      - gpt/usdc-audit
    paths:
      - .github/workflows/hixton-ui-build.yml
      - ui/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hixton-ui-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/usdc-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build current UI
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix ui ci
          npm --prefix ui test
          npm --prefix ui run check
          npm --prefix ui run build
      - name: Upload reproducible shipped bundle
        uses: actions/upload-artifact@v4
        with:
          name: hixton-ui-static-${{ github.run_id }}
          path: src/hixton/ui/static
          retention-days: 30
          if-no-files-found: error
      - name: Synchronize reproducible shipped bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- src/hixton/ui/static)" ]; then
            echo "Tracked UI bundle already matches source."
            exit 0
          fi
          git config user.name "hixton-ui[bot]"
          git config user.email "hixton-ui@users.noreply.github.com"
          git add -A src/hixton/ui/static
          git commit -m "build(ui): sync shipped static bundle"
          git push origin HEAD:gpt/usdc-audit
