name: Hixton R2 Dot1 Instrumented Native C0 Identity Gate
on:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths: [".github/workflows/hixton-r2-hold001-control-parity-20261104.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HIXTON_RESEARCH_ONLY: "1"
      HIXTON_NO_TRADING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Bind original immutable source input, do not rewrite native product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p download extracts result
          gh release download research-data-20261103-five-dot-inputs -R "$GH_REPO" -p Hixton-Five-Synthetic-Worlds-20261103.zip -D download
          echo "5262f12bef7182ae10e2c85fe5b790263404764e98e759196dbdfb7d0970d278  download/Hixton-Five-Synthetic-Worlds-20261103.zip" | sha256sum -c
          python3 - <<'PY'
          import zipfile,pathlib
          root=pathlib.Path("extracts").resolve()
          with zipfile.ZipFile("download/Hixton-Five-Synthetic-Worlds-20261103.zip") as z:
            if not all((root/k.filename).resolve().is_relative_to(root) for k in z.infolist()):raise RuntimeError("ZIP_ESCAPE")
            z.extractall(root)
          PY
      - name: Confirm disabled R2 hooks EXACTLY match frozen original native C0 ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 -m research.r2_hold001.run_native --bundle extracts/Hixton-Five-Synthetic-Worlds-20261103 \
            --kind synthetic --window cycles --cost current --mode control --out result/cycles__current
          echo NATIVE_R2_DISABLED_HOOKS_MATCH_ALL_ORIGINAL_FINANCIAL_LEDGERS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hixton-r2-hold001-native-control-parity-${{ github.run_id }}
          path: result/
          retention-days: 30
          if-no-files-found: warn
