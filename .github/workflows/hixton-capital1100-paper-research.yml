name: Hixton 1100 USDC Dynamic Capital and Paper Leverage Risk

on:
  push:
    branches: [codex/hixton-capital1100-paper-20261011]
    paths:
      - .github/workflows/hixton-capital1100-paper-research.yml
      - scripts/research_capital1100_paper_20261011.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a02-a07-a08-investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout isolated research commit; disable checkout credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research venv (no exchange credentials)
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
          .venv/bin/python -m py_compile scripts/research_capital1100_paper_20261011.py
      - name: Verify existing frozen-V6 and V8 product invariants
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q \
            tests/test_current_v6_product_contract.py \
            tests/test_v8_product_backtest.py \
            tests/test_backtest_exact_three_year.py
      - name: Restore cached public historical market candles
        id: candles
        uses: actions/cache@v4
        with:
          path: data/
          key: hixton-keyfree-public-15-20261010-19-v1
      - name: A07 recover public Binance Vision data if cache absent
        if: steps.candles.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          .venv/bin/python - <<'PY' | tee evidence/market-data-provenance.log
          from datetime import UTC,datetime,timedelta
          from pathlib import Path
          from hixton.domain.versions import strategy_definition
          from hixton.data.binance import BinancePublicClient
          from hixton.data.storage import CandleStore
          from hixton.data.sync import synchronize_symbol
          end=datetime(2026,10,10,19,tzinfo=UTC)
          start=end.replace(year=end.year-3)-timedelta(hours=400)
          client=BinancePublicClient(base_url="https://data-api.binance.vision")
          with CandleStore(Path("data/hixton-usdc.sqlite3")) as store:
              for symbol in strategy_definition("v8").symbols:
                  initial=client.first_available_open(symbol,start=start,end_exclusive=end)
                  report=synchronize_symbol(client=client,store=store,symbol=symbol,start=initial,end_exclusive=end)
                  print(symbol,initial.isoformat(),report.quality.candle_count,flush=True)
          PY
      - name: A02 1100 USDC comparison and paper liquidation risk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          .venv/bin/python scripts/research_capital1100_paper_20261011.py \
             --end 2026-10-10T19:00:00Z \
             --output evidence/capital1100-paper-research.json \
             | tee evidence/a02-capital1100.log
      - name: A08 independent evidence checks
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          from decimal import Decimal
          p=json.load(open("evidence/capital1100-paper-research.json"))
          assert p["starting_cash_usdc"]=="1100"
          assert p["no_live_orders"] and p["no_credentials_read"]
          assert p["no_paper_account_mutation"] and p["research_only_no_promotion"]
          assert p["baseline_runtime_unchanged"]
          assert len(p["cases"])==9
          baseline=p["cases"]["canonical_2x550"]
          assert baseline["slot_count"]==2 and baseline["tranche_usdc"]=="550"
          print("Reference 1100:",baseline["scenarios"]["current"]["end_usdc"])
          for name,case in p["cases"].items():
              assert Decimal(case["max_intended_commitment_usdc"])<=1100
              b=case["scenarios"]["current"]; s=case["scenarios"]["stress"]
              print(name,"normal",b["end_usdc"],"stress",s["end_usdc"],
                    "trades",b["trades"],"DD",b["max_drawdown_pct"])
          x=p["illustrative_leverage_risk_not_portfolio_pnl"]
          assert x["scenarios"]["constant_10x"]["trades"]==baseline["scenarios"]["current"]["trades"] or x["scenarios"]["constant_10x"]["trades"]>0
          print("Liquidation sensitivity:", {k:(v["trades"],v["liquidation_touches"]) for k,v in x["scenarios"].items()})
          PY
      - name: Upload immutable research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hixton-1100-usdc-capital-paper-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
