name: Hixton Current Product Validation

on:
  workflow_dispatch:
  push:
    branches: [codex/hixton-local-fixes-20261011]
    paths:
      - src/**
      - tests/**
      - ui/**
      - pyproject.toml
      - .github/workflows/hixton-current-product-validation.yml

permissions:
  contents: read

jobs:
  current-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile and validate all maintained product source and tests
        run: |
          python -m compileall -q src
          python -m ruff check src tests
          python -m mypy src
      - name: Full regression including fake Binance execution and restart recovery
        run: python -m pytest --junitxml=product-regression.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build current UI
        working-directory: ui
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-product-${{ github.sha }}
          path: product-regression.xml
          if-no-files-found: warn
          retention-days: 14
