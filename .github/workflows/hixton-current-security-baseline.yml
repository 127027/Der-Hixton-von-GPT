name: Hixton Current Security and 16 Backtests

on:
  push:
    branches:
      - codex/hixton-preflight-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact Hixton V8 reference commit
        uses: actions/checkout@v4
        with:
          ref: c004eaf244e1638e6cbb4da8a4a9b5a9e8f71776
          persist-credentials: false
      - name: Prepare evidence directory
        run: mkdir -p evidence/preflight-20261010
      - name: Audit all tracked files and laptop ZIP
        shell: bash
        run: |
          python - <<'PY'
          import json, re, subprocess, zipfile
          from pathlib import Path
          out = Path("evidence/preflight-20261010/security.json")
          tracked = [p.decode() for p in subprocess.check_output(["git","ls-files","-z"]).split(b"\0") if p]
          patterns = {
              "private_key": re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"),
              "aws_key": re.compile(rb"AKIA[0-9A-Z]{16}"),
              "github_token": re.compile(rb"gh[pousr]_[A-Za-z0-9_]{25,}"),
              "slack_token": re.compile(rb"xox[baprs]-[A-Za-z0-9-]{20,}"),
              "long_literal_secret": re.compile(rb"(?i)(?:api[_-]?secret|private[_-]?key|binance[_-]?secret|github[_-]?token)\s*[=:]\s*[\x27\x22][A-Za-z0-9+/=_-]{24,}[\x27\x22]"),
          }
          alerts = []; archives = []; backtest_exports = []
          def inspect(path, data):
              for label, pattern in patterns.items():
                  if pattern.search(data): alerts.append({"path":path,"type":label})
          forbidden_ext = (".pem", ".key", ".sqlite", ".sqlite3", ".db", ".p12", ".pfx")
          forbidden_names = ("/.env", "/secrets/", "/private/", "/credentials.json", "/account.json")
          for path in tracked:
              p = Path(path); norm = "/" + path.lower()
              if norm.endswith(forbidden_ext) or any(x in norm for x in forbidden_names): alerts.append({"path":path,"type":"sensitive_filename"})
              if p.suffix.lower() == ".csv": backtest_exports.append(path)
              if p.suffix.lower() == ".zip":
                  with zipfile.ZipFile(p) as z:
                      names = z.namelist()
                      archives.append({"path":path,"members":len(names)})
                      for member in z.infolist():
                          name = member.filename
                          check = "/" + name.lower()
                          if check.endswith(forbidden_ext) or any(x in check for x in forbidden_names): alerts.append({"path":path+"!"+name,"type":"sensitive_archive_filename"})
                          if not member.is_dir() and member.file_size < 4_000_000:
                              inspect(path+"!"+name,z.read(member))
              elif p.is_file() and p.stat().st_size < 5_000_000:
                  inspect(path,p.read_bytes())
          result={"commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"tracked_files":len(tracked),"archives":archives,"historical_backtest_csv_files":backtest_exports,"alert_count":len(alerts),"alerts":alerts,"human_license_review_required":True}
          out.write_text(json.dumps(result,indent=2,ensure_ascii=False))
          print(json.dumps(result,indent=2,ensure_ascii=False))
          if alerts: raise SystemExit("PUBLICATION_BLOCKED: potential sensitive content detected")
          PY
      - name: Install isolated Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create fresh virtual environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Status and product tests without orders
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/python src/main.py status | tee evidence/preflight-20261010/status.json
          .venv/bin/python -m pytest -q tests/test_v8_product_backtest.py tests/test_backtest_exact_three_year.py | tee evidence/preflight-20261010/tests.log
      - name: Configure official Binance Vision public endpoint (backtests only)
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("config/examples/config.example.json").read_text())
          config["runtime"]["binance_base_url"] = "https://data-api.binance.vision"
          target = Path("config/examples/config.public-research-only.json")
          target.write_text(json.dumps(config,indent=2))
          print("Public read-only market data endpoint configured for sandbox test.")
          PY
      - name: Synchronize public historical market data (read-only)
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/python src/main.py --config config/examples/config.public-research-only.json data sync --symbol ALL --end 2026-10-10T19:00:00Z | tee evidence/preflight-20261010/data-sync.log
      - name: Run 15 isolated coin backtests x 250 USDC (V8)
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/python src/main.py --config config/examples/config.public-research-only.json backtest all --strategy v8 --end 2026-10-10T19:00:00Z | tee evidence/preflight-20261010/all-15.log
      - name: Run shared 15-market portfolio x 250 USDC (V8)
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/python src/main.py --config config/examples/config.public-research-only.json backtest portfolio --strategy v8 --end 2026-10-10T19:00:00Z | tee evidence/preflight-20261010/shared-250.log
      - name: Upload evidence even if the baseline is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hixton-current-security-and-backtests
          path: |
            evidence/preflight-20261010/
            backtests/v8/runs/
          if-no-files-found: warn
          retention-days: 14
