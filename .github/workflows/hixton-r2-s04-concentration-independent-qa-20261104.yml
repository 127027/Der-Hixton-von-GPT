name: Hixton S04 Independent Coin Concentration and HWM Drawdown QA
on:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths: [".github/workflows/hixton-r2-s04-concentration-independent-qa-20261104.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-rederive-frozen-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HIXTON_NO_TRADING: "1"
      HIXTON_RESEARCH_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.3.5
      - name: Fetch original frozen f56 price data, S02 hourly trace and latest S04 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive extracted native previous audit
          gh release download research-data-20261103-five-dot-inputs -R "$GH_REPO" -p Hixton-Loss-Handoff-20261102.zip -D archive
          echo "d1d1cde8347665d74da71f9e44bb3876dc6662bfe4bfc9e34dcab1dfecd84308  archive/Hixton-Loss-Handoff-20261102.zip" | sha256sum -c
          gh run download 41889629161 -R "$GH_REPO" -n hixton-r2-s02-paired-native-41889629161 -D native
          gh run download 41897449596 -R "$GH_REPO" -n hixton-s04-concentration-drawdown-41897449596 -D previous
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path("extracted").resolve()
          with zipfile.ZipFile("archive/Hixton-Loss-Handoff-20261102.zip") as z:
              if not all((root/x.filename).resolve().is_relative_to(root) for x in z.infolist()):raise RuntimeError("ZIP_PATH_ESCAPE")
              z.extractall(root)
          PY
      - name: Independently verify all 26304h original native price-based denominators and drawdowns
        run: |
          python -m research.r2_s01.s04_independent_concentration_qa --bundle extracted/Hixton-Loss-Handoff-20261102 --control native/C0-native-hourly.json.gz --candidate native/S01-native-hourly.json.gz --report previous/S04-CONCENTRATION-001-native-drawdowns.json --output audit/S04-CONCENTRATION-001-independent-QA.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hixton-s04-concentration-independent-qa-${{ github.run_id }}
          path: audit/
          retention-days: 30
          if-no-files-found: warn
