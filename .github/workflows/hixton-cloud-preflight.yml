name: Hixton Cloud Swarm Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/usdc-audit
    paths:
      - scripts/swarm_core.py
      - tests/test_swarm_core.py
      - agent_memory/**
      - .github/workflows/hixton-cloud-preflight.yml
      - .github/workflows/hixton-cloud-swarm-reusable.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout engineering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate cloud-swarm contract
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
          .venv/bin/python -m compileall -q scripts
          .venv/bin/pytest -q tests/test_swarm_core.py
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from scripts.swarm_core import validate_cloud_ready
          print(validate_cloud_ready(Path('.')))
          PY

      - name: Confirm engineering is cloud-only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t batch_files < <(git ls-files '*.bat')
          if [ "${#batch_files[@]}" -ne 1 ] || [ "${batch_files[0]}" != "Startbot.bat" ]; then
            printf '::error::Unexpected tracked batch launchers: %s\n' "${batch_files[*]}"
            exit 1
          fi
          if git ls-files 'scripts/*.ps1' | grep -q .; then
            echo "::error::Local PowerShell engineering runners are not allowed."
            exit 1
          fi
          echo "Cloud-only engineering boundary confirmed; Startbot.bat is the sole tracked batch launcher."

      - name: Confirm legacy local-agent markers are absent from current tracked text
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path

          forbidden = (
              "Start" + "Agent",
              "Agent" + "Chat",
              "local_" + "agent",
              "agent_" + "chat",
              "swarm_" + "runner",
          )
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          hits = []
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode())
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for marker in forbidden:
                  if marker in text:
                      hits.append(f"{path}: {marker}")
          if hits:
              raise SystemExit("Legacy local-agent markers remain:\n" + "\n".join(hits))
          print("No legacy local-agent marker remains in current tracked UTF-8 text.")
          PY
