name: Hixton R2-S02 Pre-Registered One-Factor Native No-Cooldown Diagnostic
on:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths: [".github/workflows/hixton-r2-s02-single-factor-cooldown-ablation-20261104.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-s01-same-exits-no-coin-lock-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HIXTON_NO_TRADING: "1"
      HIXTON_RESEARCH_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.3.5
      - name: Verify preregistration, frozen source, immutable historical data and old S01
        shell: bash
        run: |
          set -euo pipefail
          test -s research/r2_s01/R2-S02-ABL-001-no-cooldown-prereg-20261104.md
          mkdir -p archive extracted original output
          gh release download research-data-20261103-five-dot-inputs -R "$GH_REPO" -p Hixton-Loss-Handoff-20261102.zip -D archive
          echo "d1d1cde8347665d74da71f9e44bb3876dc6662bfe4bfc9e34dcab1dfecd84308  archive/Hixton-Loss-Handoff-20261102.zip" | sha256sum -c
          gh run download 41873929231 -R "$GH_REPO" -n hixton-r2-s01-a-current-ledger-evidence-41873929231 -D original
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path("extracted").resolve()
          with zipfile.ZipFile("archive/Hixton-Loss-Handoff-20261102.zip") as z:
              if not all((root/x.filename).resolve().is_relative_to(root) for x in z.infolist()):
                  raise RuntimeError("ZIP_PATH_ESCAPE")
              z.extractall(root)
          PY
      - name: Run exactly one separately registered native single-factor cooldown ablation
        run: |
          python -m research.r2_s01.s02_single_factor_cooldown_ablation --bundle extracted/Hixton-Loss-Handoff-20261102 --original-s01 original/S01-A-current-active-native.json --output output/native-no-cooldown-full.json --trace output/native-no-cooldown-hourly.json.gz --summary output/S02-ABL-001-Results.json
      - name: QA that test never touches production and outputs native reconciled ledger
        run: |
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path("output/S02-ABL-001-Results.json").read_text())
          assert x["exact_original_native_fill_trade_audit"]=="NATIVE_EVENT_LEDGER_RECONCILED"
          assert x["no_strategy_promotion"] and x["all_original_f56_native_entry_rules_intact"]
          assert x["code_policy_git_blob"]=="b104854b95ecf1623dd6fcfbbba9d5303a8909fb"
          print("R2_S02_ABLATION_PRE_ECONOMIC_ONE_FACTOR_GUARD_AND_NATIVE_LEDGER_QA_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hixton-r2-s02-one-factor-cooldown-ablation-${{ github.run_id }}
          path: output/
          retention-days: 30
          if-no-files-found: warn
