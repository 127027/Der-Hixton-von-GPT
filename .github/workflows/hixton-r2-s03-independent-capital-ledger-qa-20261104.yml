name: Hixton S03 Independent Frozen Native Capital and Monthly Ledger QA
on:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths: [".github/workflows/hixton-r2-s03-independent-capital-ledger-qa-20261104.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-closed-candle-mark-to-native-value:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HIXTON_NO_TRADING: "1"
      HIXTON_RESEARCH_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.3.5
      - name: Reuse existing original f56 historical sources and prior native S02/S03 outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive extracted prior capital audit
          gh release download research-data-20261103-five-dot-inputs -R "$GH_REPO" -p Hixton-Loss-Handoff-20261102.zip -D archive
          echo "d1d1cde8347665d74da71f9e44bb3876dc6662bfe4bfc9e34dcab1dfecd84308  archive/Hixton-Loss-Handoff-20261102.zip" | sha256sum -c
          gh run download 41889629161 -R "$GH_REPO" -n hixton-r2-s02-paired-native-41889629161 -D prior
          gh run download 41891428521 -R "$GH_REPO" -n hixton-r2-s03-capital-compounding-41891428521 -D capital
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path("extracted").resolve()
          with zipfile.ZipFile("archive/Hixton-Loss-Handoff-20261102.zip") as z:
              if not all((root/x.filename).resolve().is_relative_to(root) for x in z.infolist()):
                  raise RuntimeError("ZIP_PATH_ESCAPE")
              z.extractall(root)
          PY
      - name: Independent 26304-hour USD cash and coin-marking audit and no-reset monthly growth checks
        run: |
          python -m research.r2_s01.s03_independent_capital_qa --control prior/C0-native-hourly.json.gz --candidate prior/S01-native-hourly.json.gz --report capital/S03-CAP-001-capital-growth.json --bundle extracted/Hixton-Loss-Handoff-20261102 --output audit/S03-CAP-001-separate-QA.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hixton-r2-s03-independent-capital-QA-${{ github.run_id }}
          path: audit/
          retention-days: 30
          if-no-files-found: warn
