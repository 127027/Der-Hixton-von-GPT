name: Hixton Agent Memory Validation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/codex-supervisor-v1
    paths:
      - 'agent_memory/**'
      - 'AGENTS.md'
      - '.github/workflows/codex-supervisor.yml'

permissions:
  contents: read

jobs:
  validate-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate persistent agent state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('agent_memory/state.json')
          if not path.exists():
              raise SystemExit('agent_memory/state.json is missing')

          state = json.loads(path.read_text(encoding='utf-8'))
          required_areas = [
              'inventory', 'architecture', 'dataflows', 'ui_map',
              'storage', 'tests', 'security', 'cross_check'
          ]
          areas = state.get('areas') or {}
          missing = [name for name in required_areas if name not in areas]
          if missing:
              raise SystemExit(f'Missing progress areas: {missing}')

          for name in required_areas:
              value = areas[name]
              if not isinstance(value, int) or not 0 <= value <= 100:
                  raise SystemExit(f'Invalid progress value {name}={value!r}')

          progress = state.get('progress_percent')
          if not isinstance(progress, int) or not 0 <= progress <= 100:
              raise SystemExit(f'Invalid progress_percent={progress!r}')

          expected = round(sum(areas[name] for name in required_areas) / len(required_areas))
          if progress != expected:
              raise SystemExit(f'progress_percent must equal rounded area mean: expected {expected}, got {progress}')

          if state.get('bootstrap_complete'):
              incomplete = [name for name in required_areas if areas[name] != 100]
              flags = [
                  'inventory_complete', 'architecture_complete', 'dataflows_complete',
                  'ui_map_complete', 'storage_complete', 'tests_complete',
                  'security_complete', 'cross_check_complete'
              ]
              false_flags = [name for name in flags if not state.get(name)]
              unresolved = state.get('unresolved_repository_questions') or []
              if incomplete or false_flags or unresolved:
                  raise SystemExit(
                      'Invalid bootstrap completion: '
                      f'incomplete={incomplete}, false_flags={false_flags}, unresolved={unresolved}'
                  )

          print(f"Agent mode: {state.get('mode', 'UNKNOWN')}")
          print(f"Learning progress: {progress}%")
          print(f"Current focus: {state.get('current_focus', 'UNKNOWN')}")
          print(f"Bootstrap complete: {bool(state.get('bootstrap_complete'))}")
          PY

      - name: Confirm no OpenAI secret is required
        run: echo 'This workflow validates committed agent memory only. Codex runs locally and no OPENAI_API_KEY is stored or required on GitHub.'
