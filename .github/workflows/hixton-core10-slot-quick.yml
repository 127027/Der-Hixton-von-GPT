name: Hixton Core10 Slot Quick

on:
  push:
    branches:
      - gpt/15coin-satellite-integration
    paths:
      - .github/workflows/hixton-core10-slot-quick.yml
      - scripts/research_core10_slot_quick.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hixton-core10-slot-quick
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/15coin-satellite-integration
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
      - name: Static
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m py_compile scripts/research_core10_slot_quick.py
          .venv/bin/ruff check scripts/research_core10_slot_quick.py
      - name: Run
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/research_core10_slot_quick.py
      - uses: actions/upload-artifact@v4
        with:
          name: hixton-core10-slot-quick-${{ github.run_id }}
          path: evidence/core10-slot-layout-quick.json
          retention-days: 30
          if-no-files-found: error
