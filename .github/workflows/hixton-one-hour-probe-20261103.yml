# One-off research observation authorized 2026-11-03; no bot/live changes.
name: Hixton four read-only checkpoints
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hixton-one-hour-probe-20261103.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: read
jobs:
  one-hour:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The original data ZIPs and both offline verifiers passed in run 41621096852.
      # Avoid re-downloading/rechecking identical immutable inputs in this repair run.
      - name: Four checkpoints at 15-minute intervals
        shell: bash
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib,time,urllib.request
          repo=os.environ["GH_REPO"];token=os.environ["GH_TOKEN"];selfid=int(os.environ["GH_RUN_ID"])
          prior=None;out=pathlib.Path("audit");out.mkdir(parents=True,exist_ok=True)
          def read(path):
            r=urllib.request.Request("https://api.github.com/repos/"+repo+path,headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","User-Agent":"Hixton-Observer"})
            try:
              with urllib.request.urlopen(r,timeout=30) as f:return json.load(f)
            except Exception as e:return {"error":str(e)}
          for n in range(4):
            if n:time.sleep(900)
            issue=read("/issues/18");runs=read("/actions/runs?per_page=25");commits=read("/commits?per_page=10")
            state={"commit_shas":[x.get("sha") for x in commits if isinstance(x,dict)],"other_action_ids":[x.get("id") for x in runs.get("workflow_runs",[]) if x.get("id")!=selfid],"issue_updated":issue.get("updated_at"),"issue_comments":issue.get("comments")}
            diff={}
            if prior:
              diff={"new_commits":list(set(state["commit_shas"])-set(prior["commit_shas"])),"new_action_runs":list(set(state["other_action_ids"])-set(prior["other_action_ids"])),"issue_updated":state["issue_updated"]!=prior["issue_updated"],"issue_comments_changed":state["issue_comments"]!=prior["issue_comments"]}
            report={"check":n+1,"at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"github_evidence":state,"change":diff,"chatgpt_dot_state":"UNOBSERVABLE_FROM_GITHUB","note":"ChatGPT Dot progress cannot be read from GitHub without an authorized Dot connector; do not claim GitHub changes prove a Dot executed.","errors":{"issue":issue.get("error"),"runs":runs.get("error"),"commits":commits.get("error") if isinstance(commits,dict) else None}}
            (out/("check-"+str(n+1)+".json")).write_text(json.dumps(report,indent=2)+"\n")
            print("CHECK",n+1,json.dumps({"at_utc":report["at_utc"],"change":diff,"dot_state":report["chatgpt_dot_state"]}),flush=True)
            prior=state
          PY
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hixton-observer-${{ github.run_id }}
          path: audit/*
          retention-days: 14
          if-no-files-found: warn
