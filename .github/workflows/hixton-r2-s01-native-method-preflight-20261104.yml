name: Hixton R2 S01 Isolated Native Pre-Economic Method QA
on:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths:
      - "research/r2_s01/native_s01_policy.py"
      - "research/r2_s01/run_native_s01.py"
      - "research/r2_s01/native_method_fixtures.py"
      - ".github/workflows/hixton-r2-s01-native-method-preflight-20261104.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  s01-native-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HIXTON_RESEARCH_ONLY: "1"
      HIXTON_NO_TRADING: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original numeric dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Verify unchanged original archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive extracted audit
          gh release download research-data-20261103-five-dot-inputs -R "$GH_REPO" -p Hixton-Loss-Handoff-20261102.zip -D archive
          echo "d1d1cde8347665d74da71f9e44bb3876dc6662bfe4bfc9e34dcab1dfecd84308  archive/Hixton-Loss-Handoff-20261102.zip" | sha256sum -c
          python - <<'PY'
          import zipfile,pathlib
          root=pathlib.Path("extracted").resolve()
          with zipfile.ZipFile("archive/Hixton-Loss-Handoff-20261102.zip") as z:
              assert all((root / x.filename).resolve().is_relative_to(root) for x in z.infolist())
              z.extractall(root)
          PY
      - name: Dot2/Dot4 native deterministic fixtures (NOT independent QA signoff)
        run: |
          PYTHONPATH="extracted/Hixton-Loss-Handoff-20261102/engine/src:." python -m research.r2_s01.native_method_fixtures extracted/Hixton-Loss-Handoff-20261102
      - name: C0 original_32k current native full ledger/equity parity with disabled S01
        run: |
          python -m research.r2_s01.run_native_s01 \
            --bundle extracted/Hixton-Loss-Handoff-20261102 \
            --window original_32k --cost current --mode control \
            --output audit/s01-disabled-original32k-current-c0-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hixton-r2-s01-native-preflight-${{ github.run_id }}
          path: audit/
          retention-days: 30
          if-no-files-found: warn
