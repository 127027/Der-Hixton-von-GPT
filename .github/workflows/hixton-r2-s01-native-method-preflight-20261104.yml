name: Hixton R2 S01 Isolated Native Pre-Economic Method QA
on:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths:
      - "research/r2_s01/native_s01_policy.py"
      - "research/r2_s01/run_native_s01.py"
      - "research/r2_s01/native_method_fixtures.py"
      - "research/r2_s01/s01_predicate_prefix_fixtures.py"
      - ".github/workflows/hixton-r2-s01-native-method-preflight-20261104.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  s01-native-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HIXTON_RESEARCH_ONLY: "1"
      HIXTON_NO_TRADING: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original numeric dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Verify unchanged original archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive extracted audit
          gh release download research-data-20261103-five-dot-inputs -R "$GH_REPO" -p Hixton-Loss-Handoff-20261102.zip -D archive
          echo "d1d1cde8347665d74da71f9e44bb3876dc6662bfe4bfc9e34dcab1dfecd84308  archive/Hixton-Loss-Handoff-20261102.zip" | sha256sum -c
          python - <<'PY'
          import zipfile,pathlib
          root=pathlib.Path("extracted").resolve()
          with zipfile.ZipFile("archive/Hixton-Loss-Handoff-20261102.zip") as z:
              assert all((root / x.filename).resolve().is_relative_to(root) for x in z.infolist())
              z.extractall(root)
          PY
      - name: Dot2/Dot4 native deterministic fixtures (NOT independent QA signoff)
        run: |
          PYTHONPATH="extracted/Hixton-Loss-Handoff-20261102/engine/src:." python -m research.r2_s01.native_method_fixtures extracted/Hixton-Loss-Handoff-20261102
      - name: Activated current S01-A native full-exit and separate accounting audit
        run: |
          python -m research.r2_s01.run_native_s01 \
            --bundle extracted/Hixton-Loss-Handoff-20261102 \
            --window original_32k --cost current --mode candidate \
            --output audit/s01-current-activated-native-ledger.json
      - name: Inspect current-code true fills, ledger, and comparison with older diagnostic
        run: |
          python - <<'PY'
          import json,pathlib,decimal
          x=json.loads(pathlib.Path("audit/s01-current-activated-native-ledger.json").read_text())
          qa=x["native_s01_fill_trade_ledger_audit"]
          assert qa["status"]=="NATIVE_EVENT_LEDGER_RECONCILED",qa
          assert qa["native_confirmed_s01_exits"]>0
          assert qa["native_confirmed_s01_exits"]==x["s01_executed_count"]
          result={"code":"CURRENT_S01_A","scope":"original_32k/current","ledger":qa["status"],
                  "confirmed_native_s01_exits":qa["native_confirmed_s01_exits"],
                  "current_ending_usdc":x["candidate_ending_equity_usdc"],
                  "older_ending_usdc":"10967.68139761524970000000",
                  "same_terminal_equity_as_older":decimal.Decimal(str(x["candidate_ending_equity_usdc"]))==decimal.Decimal("10967.68139761524970000000"),
                  "independent_Dot4_method_signoff":"NOT_ASSUMED_FROM_CI_PASS",
                  "product_or_live_change":False}
          pathlib.Path("audit/current-s01-method-summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print("CURRENT_S01_NATIVE_LEDGER_CHECK",json.dumps(result),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hixton-r2-s01-native-preflight-${{ github.run_id }}
          path: audit/
          retention-days: 30
          if-no-files-found: warn
