name: Hixton V1 Progress Watchdog

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hixton-v1-progress-watchdog.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: hixton-v1-progress-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect Hixton progress and detect stalls
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESEARCH_REF: gpt/autonomous-research-v1
          PRODUCT_REF: gpt/usdc-audit
          ISSUE_NUMBER: "3"
        run: |
          set -euo pipefail

          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          product_sha="$(gh api "repos/$REPO/git/ref/heads/$PRODUCT_REF" --jq '.object.sha')"
          research_sha="$(gh api "repos/$REPO/git/ref/heads/$RESEARCH_REF" --jq '.object.sha')"

          mission_json="$(
            gh api "repos/$REPO/contents/agent_memory/autonomy/current_mission.json?ref=$RESEARCH_REF"               --jq '.content' | tr -d '\n' | base64 -d
          )"
          stage="$(jq -r '.current_stage // "UNKNOWN"' <<<"$mission_json")"

          runs="$(
            gh api "repos/$REPO/actions/workflows/hixton-autonomous-research.yml/runs?branch=$RESEARCH_REF&per_page=10"
          )"
          latest_id="$(jq -r '.workflow_runs[0].id // 0' <<<"$runs")"
          latest_number="$(jq -r '.workflow_runs[0].run_number // 0' <<<"$runs")"
          latest_status="$(jq -r '.workflow_runs[0].status // "none"' <<<"$runs")"
          latest_conclusion="$(jq -r '.workflow_runs[0].conclusion // "none"' <<<"$runs")"
          latest_updated="$(jq -r '.workflow_runs[0].updated_at // "none"' <<<"$runs")"

          if [ "$latest_id" != "0" ]; then
            jobs="$(gh api "repos/$REPO/actions/runs/$latest_id/jobs?per_page=100")"
            job_state="$(jq -c '[.jobs[] | {
              name,
              status,
              conclusion,
              steps: [(.steps // [])[] | {name,status,conclusion}]
            }]' <<<"$jobs")"
            active_step="$(jq -r '
              [.jobs[] | (.steps // [])[] | select(.status=="in_progress") | .name][0] //
              [.jobs[] | select(.status=="in_progress") | .name][0] //
              "none"
            ' <<<"$jobs")"
            failed_step="$(jq -r '
              [.jobs[] | (.steps // [])[] | select(.conclusion=="failure") | .name][0] //
              [.jobs[] | select(.conclusion=="failure") | .name][0] //
              "none"
            ' <<<"$jobs")"
          else
            job_state="[]"
            active_step="none"
            failed_step="none"
          fi

          semantic="$research_sha|$stage|$latest_status|$latest_conclusion|$active_step|$failed_step|$job_state"
          fingerprint="$(printf '%s' "$semantic" | sha256sum | awk '{print $1}')"

          comments="$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments?per_page=100")"
          previous_body="$(jq -r '[.[] | select(.body | contains("<!-- HIXTON_15M_STATE"))][-1].body // ""' <<<"$comments")"
          previous_fp="$(sed -n 's/.*fingerprint=\([0-9a-f]*\).*/\1/p' <<<"$previous_body" | tail -1)"
          previous_same="$(sed -n 's/.*same=\([0-9][0-9]*\).*/\1/p' <<<"$previous_body" | tail -1)"
          previous_same="${previous_same:-0}"

          if [ "$fingerprint" = "$previous_fp" ] && [ -n "$previous_fp" ]; then
            same_count=$((previous_same + 1))
          else
            same_count=0
          fi

          classification="PROGRESS"
          action="none"
          detail="State changed since the previous 15-minute checkpoint."

          if [ "$same_count" -ge 1 ]; then
            if [ "$latest_status" = "in_progress" ] || [ "$latest_status" = "queued" ]; then
              classification="INVESTIGATE_SLOW"
              detail="The same run/job/step state persisted for at least one 15-minute interval. Inspect whether this is legitimate compute time or a real stall; do not cancel solely because 15 minutes elapsed."
              if [ "$same_count" -ge 4 ]; then
                classification="POSSIBLE_ACTIVE_STALL"
                detail="The same active run/job/step state persisted for roughly an hour or more. Treat as a probable stall unless logs/evidence show expected long computation."
              fi
            else
              if [ "$latest_conclusion" = "success" ]; then
                classification="HANDOFF_STALL"
                detail="The latest research run succeeded but research HEAD/stage/run state did not advance for at least 15 minutes. The pipeline handoff to the next research stage needs investigation/correction."
              elif [ "$latest_conclusion" = "failure" ] || [ "$latest_conclusion" = "cancelled" ] || [ "$latest_conclusion" = "timed_out" ]; then
                classification="FAILED_STALL"
                detail="The latest research run is failed/cancelled/timed-out and no newer progress appeared for at least 15 minutes."
                # One safe automatic retry only for the first detected failed stall on the same 15-minute state.
                if [ "$same_count" -eq 1 ] && [ "$latest_id" != "0" ]; then
                  if gh run rerun "$latest_id" --failed --repo "$REPO"; then
                    action="rerun_failed_jobs_once"
                    detail="$detail A one-time failed-job rerun was requested. Repeated identical failure must be diagnosed, not looped."
                  else
                    action="rerun_request_failed"
                    detail="$detail Automatic failed-job rerun could not be requested."
                  fi
                fi
              else
                classification="NO_PROGRESS"
                detail="No active research and no new state for at least 15 minutes."
              fi
            fi
          fi

          body="$(cat <<EOF
          WATCHDOG 15M — $now

          - Classification: **$classification**
          - Product HEAD: $product_sha
          - Research HEAD: $research_sha
          - Mission stage: $stage
          - Latest research run: #$latest_number / $latest_id
          - Run status: $latest_status
          - Conclusion: $latest_conclusion
          - Last GitHub update: $latest_updated
          - Active step: $active_step
          - Failed step: $failed_step
          - Same-state intervals: **$same_count**
          - Automatic action: $action

          $detail

          Required controller behavior:
          - If **PROGRESS**, continue normally.
          - If **INVESTIGATE_SLOW**, inspect the active job/step and expected runtime; do not kill healthy compute.
          - If **POSSIBLE_ACTIVE_STALL**, inspect exact blocker/logs and repair only when evidence supports a real stall.
          - If **HANDOFF_STALL**, do not blindly rerun the finished stage; advance/fix the missing next-stage bridge.
          - If **FAILED_STALL**, diagnose the failure signature after the one safe retry; never create a retry loop.

          <!-- HIXTON_15M_STATE fingerprint=$fingerprint same=$same_count run=$latest_id stage=$stage classification=$classification action=$action -->
          EOF
          )"

          gh api             --method POST             "repos/$REPO/issues/$ISSUE_NUMBER/comments"             -f body="$body"

          echo "$body"
