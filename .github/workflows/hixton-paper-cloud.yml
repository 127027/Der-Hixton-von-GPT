name: Hixton Paper 24x7

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hixton-paper-cloud.yml
  workflow_dispatch:
  schedule:
    # Native strategy decisions use finalized 1h candles. Two durable recovery
    # cycles per hour are sufficient; checkpoints catch up any delayed run.
    - cron: "7,37 * * * *"

# Paper-only runtime: official Binance public market-data endpoint,
# simulated fills, persistent Paper ledger, no exchange secrets.
permissions:
  contents: write
  actions: read

jobs:
  paper-runtime:
