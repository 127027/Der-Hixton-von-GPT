name: Hixton Progress Watchdog 15m

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: hixton-progress-watchdog-15m
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Compare progress and recover deterministic stalls
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESEARCH_BRANCH: gpt/autonomous-research-v1
          PRODUCT_BRANCH: gpt/usdc-audit
          WATCH_ISSUE: "5"
          COORD_ISSUE: "3"
        run: |
          python - <<'PY'
          import base64, json, os, re, urllib.error, urllib.parse, urllib.request
          from datetime import UTC, datetime

          REPO=os.environ["REPO"]; TOKEN=os.environ["GH_TOKEN"]
          RB=os.environ["RESEARCH_BRANCH"]; PB=os.environ["PRODUCT_BRANCH"]
          WI=os.environ["WATCH_ISSUE"]; CI=os.environ["COORD_ISSUE"]
          API=f"https://api.github.com/repos/{REPO}"
          MARK="<!-- hixton-progress-watchdog -->"
          RX=re.compile(r"<!-- hixton-progress-state\n(.*?)\n-->", re.S)

          def utcnow(): return datetime.now(UTC)
          def iso(dt=None): return (dt or utcnow()).isoformat().replace("+00:00","Z")
          def dt(v):
              return datetime.fromisoformat(v.replace("Z","+00:00")).astimezone(UTC) if v else None

          def api(method,path,payload=None):
              data=None
              headers={"Authorization":f"Bearer {TOKEN}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"hixton-progress-watchdog"}
              if payload is not None:
                  data=json.dumps(payload).encode()
                  headers["Content-Type"]="application/json"
              req=urllib.request.Request(API+path,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as resp:
                      raw=resp.read()
                      return None if not raw else json.loads(raw.decode())
              except urllib.error.HTTPError as exc:
                  body=exc.read().decode(errors="replace")
                  raise RuntimeError(f"{method} {path} -> HTTP {exc.code}: {body}") from exc

          def ref(branch):
              return api("GET","/git/ref/heads/"+urllib.parse.quote(branch,safe=""))["object"]["sha"]

          def read_json(path,branch):
              q=urllib.parse.urlencode({"ref":branch})
              obj=api("GET",f"/contents/{path}?{q}")
              return obj["sha"],json.loads(base64.b64decode(obj["content"]).decode())

          def write_json(path,branch,sha,obj,message):
              return api("PUT",f"/contents/{path}",{
                  "message":message,"sha":sha,"branch":branch,
                  "content":base64.b64encode((json.dumps(obj,indent=2)+"\n").encode()).decode()
              })

          def comments(issue):
              return api("GET",f"/issues/{issue}/comments?per_page=100") or []

          def post(issue,body):
              return api("POST",f"/issues/{issue}/comments",{"body":body})

          def patch_comment(cid,body):
              return api("PATCH",f"/issues/comments/{cid}",{"body":body})

          old_comment=None
          for c in comments(WI):
              if MARK in (c.get("body") or ""): old_comment=c
          old={}
          if old_comment:
              m=RX.search(old_comment.get("body") or "")
              if m:
                  try: old=json.loads(m.group(1))
                  except Exception: old={}

          product_sha=ref(PB); research_sha=ref(RB)
          _,mission=read_json("agent_memory/autonomy/current_mission.json",RB)
          stage=str(mission.get("current_stage","UNKNOWN"))

          runs=api("GET","/actions/runs?"+urllib.parse.urlencode({"branch":RB,"per_page":30})).get("workflow_runs",[])
          runs=[r for r in runs if r.get("name")=="Hixton Autonomous Research Loop"]
          runs.sort(key=lambda x:int(x["id"]),reverse=True)
          latest=runs[0] if runs else None
          active=next((r for r in runs if r.get("status") in {"queued","in_progress","waiting","pending","requested"}),None)
          inspected=active or latest

          active_job=None; active_step=None
          if inspected:
              jobs=api("GET",f"/actions/runs/{inspected['id']}/jobs?per_page=100").get("jobs",[])
              active_job=next((j for j in jobs if j.get("status") in {"queued","in_progress","waiting","pending"}),None)
              if active_job:
                  active_step=next((s for s in active_job.get("steps",[]) if s.get("status")=="in_progress"),None)
                  if active_step is None:
                      done=[s for s in active_job.get("steps",[]) if s.get("status")=="completed"]
                      active_step=done[-1] if done else None

          snap={
              "product_sha":product_sha,"research_sha":research_sha,"stage":stage,
              "run_id":None if not inspected else inspected.get("id"),
              "run_number":None if not inspected else inspected.get("run_number"),
              "run_status":None if not inspected else inspected.get("status"),
              "run_conclusion":None if not inspected else inspected.get("conclusion"),
              "job_id":None if not active_job else active_job.get("id"),
              "job_name":None if not active_job else active_job.get("name"),
              "step_number":None if not active_step else active_step.get("number"),
              "step_name":None if not active_step else active_step.get("name"),
              "step_status":None if not active_step else active_step.get("status")
          }
          same=snap==(old.get("snapshot") or {})
          prev=dt(old.get("checked_at"))
          mins=(utcnow()-prev).total_seconds()/60 if prev else None
          stagnant=int(old.get("stagnant_checks",0))+1 if same else 0
          status="PROGRESS"
          diagnosis="Observable research state changed since previous sample."
          recovery=None
          alert_key=old.get("alert_key")

          if same and mins is not None and mins>=12:
              status="INVESTIGATE_STALL"
              diagnosis="No HEAD/run/job/step transition since previous 15-minute sample; investigate now."

          finished_at=dt(latest.get("updated_at") if latest else None)
          finished_age=(utcnow()-finished_at).total_seconds()/60 if finished_at else None

          recoverable={"failure","cancelled","timed_out","action_required"}
          if active is None and latest and latest.get("conclusion") in recoverable and old.get("recovery_for_run")!=latest.get("id"):
              hsha,hb=read_json("agent_memory/autonomy/heartbeat.json",RB)
              hb["timestamp_utc"]=iso()
              hb["reason"]="progress_watchdog_deterministic_recovery"
              hb["watchdog_recovery"]={
                  "source_run_id":latest.get("id"),"source_run_number":latest.get("run_number"),
                  "source_conclusion":latest.get("conclusion"),"stage":stage,
                  "research_sha_before_recovery":research_sha
              }
              write_json("agent_memory/autonomy/heartbeat.json",RB,hsha,hb,f"watchdog: recover after run {latest.get('run_number')}")
              recovery="HEARTBEAT_RECOVERY_COMMIT"; status="RECOVERY_TRIGGERED"
              diagnosis=f"No active run; latest Run #{latest.get('run_number')} ended {latest.get('conclusion')}; triggered one deterministic restart."
              research_sha=ref(RB); snap["research_sha"]=research_sha

          handoff=(active is None and latest and latest.get("status")=="completed" and latest.get("conclusion")=="success" and finished_age is not None and finished_age>=15 and research_sha==latest.get("head_sha"))
          this_alert=f"handoff:{stage}:{latest.get('id') if latest else 'none'}:{research_sha}"
          if handoff:
              status="HANDOFF_STALL"
              diagnosis="Successful stage has no next run/stage after >=15 minutes; escalate intelligent handoff repair and do not rerun the successful stage unchanged."
              if alert_key!=this_alert:
                  post(CI,"\n".join([
                      f"WATCHDOG STALL — {iso()}",
                      f"Product HEAD: {product_sha}",
                      f"Research HEAD: {research_sha}",
                      f"Stage: {stage}",
                      f"Latest research: Run #{latest.get('run_number')} / {latest.get('id')} = SUCCESS",
                      f"Finished age: ~{finished_age:.1f} min",
                      "Finding: no next run or stage transition within 15 minutes.",
                      "Action: intelligent stage-handoff repair required now; watchdog did not blindly rerun the successful stage."
                  ]))
                  alert_key=this_alert

          if active is not None and stagnant>=3 and same:
              status="PERSISTENT_ACTIVE_STALL"
              diagnosis="Same active run/job/step for ~45 minutes; escalate log/code diagnosis. Do not blindly cancel potentially valid heavy computation."
              this_alert=f"active:{active.get('id')}:{snap.get('job_id')}:{snap.get('step_number')}"
              if alert_key!=this_alert:
                  post(CI,"\n".join([
                      f"WATCHDOG ACTIVE STALL — {iso()}",
                      f"Research HEAD: {research_sha}",
                      f"Stage: {stage}",
                      f"Run: #{active.get('run_number')} / {active.get('id')}",
                      f"Job: {snap.get('job_name')}",
                      f"Step: {snap.get('step_name')}",
                      f"Identical samples: {stagnant+1}",
                      "Action: immediate log/code diagnosis required."
                  ]))
                  alert_key=this_alert

          state={
              "checked_at":iso(),"status":status,"diagnosis":diagnosis,"snapshot":snap,
              "stagnant_checks":stagnant,"recovery":recovery,
              "recovery_for_run":latest.get("id") if recovery else old.get("recovery_for_run"),
              "alert_key":alert_key,"latest_finished_age_minutes":finished_age,
              "policy":{"sample_minutes":15,"first_repeat":"investigate","three_active_repeats":"strong_escalation","failed_no_active":"single_restart","success_no_followup_15m":"handoff_escalation"}
          }
          body="\n".join([
              MARK,
              f"## Hixton 15-minute Progress Watchdog — {state['checked_at']}",
              f"Status: {status}",
              f"Product HEAD: {product_sha}",
              f"Research HEAD: {snap['research_sha']}",
              f"Stage: {stage}",
              f"Run: {snap['run_number']} / {snap['run_id']} — {snap['run_status']} / {snap['run_conclusion']}",
              f"Job: {snap['job_name']}",
              f"Step: {snap['step_name']} — {snap['step_status']}",
              f"Identical consecutive samples: {stagnant}",
              f"Diagnosis: {diagnosis}",
              f"Recovery: {recovery or 'none'}",
              "No strategy/product/Paper/Live/credential/order mutations are permitted here.",
              "<!-- hixton-progress-state",
              json.dumps(state,sort_keys=True),
              "-->"
          ])
          if old_comment: patch_comment(old_comment["id"],body)
          else: post(WI,body)
          print(json.dumps(state,indent=2))
          PY
