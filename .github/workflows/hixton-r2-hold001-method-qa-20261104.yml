name: Hixton R2 Dot1 Pre-Economic Native Method QA
on:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths: [".github/workflows/hixton-r2-hold001-method-qa-20261104.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  method-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HIXTON_RESEARCH_ONLY: "1"
      HIXTON_NO_TRADING: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download original f56 native engine from previously verified release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download research-data-20261103-five-dot-inputs -R "$GH_REPO" -p Hixton-Five-Synthetic-Worlds-20261103.zip -D input
          echo "5262f12bef7182ae10e2c85fe5b790263404764e98e759196dbdfb7d0970d278  input/Hixton-Five-Synthetic-Worlds-20261103.zip" | sha256sum -c
          python3 - <<'PY'
          import zipfile,pathlib
          z=zipfile.ZipFile("input/Hixton-Five-Synthetic-Worlds-20261103.zip")
          roots=[x for x in z.namelist() if x.endswith("engine/src/hixton/backtest/portfolio.py")]
          assert len(roots)==1
          pre=roots[0].split("engine/src/hixton/backtest/portfolio.py")[0]
          for member in z.namelist():
            if member.startswith(pre+"engine/src/hixton/") and member.endswith(".py"):
              out=pathlib.Path("input/native/")/member[len(pre+"engine/src/"):]
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(z.read(member))
          print("NATIVE_SOURCE_EXTRACTED",str(pathlib.Path("input/native/hixton/backtest/portfolio.py")),flush=True)
          PY
      - name: Independent negative and positive research safety fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          python3 - <<'PY'
          import hashlib,json,pathlib,sys,types,unittest
          root=pathlib.Path.cwd()
          sys.path.insert(0,str(root))
          sys.path.insert(0,str(root/"input/native"))
          stub=types.ModuleType("hixton.data")
          stub.__package__="hixton.data"
          stub.__path__=[str(root/"input/native/hixton/data")]
          sys.modules["hixton.data"]=stub
          from research.r2_hold001.held_policy import instrument
          original=(root/"input/native/hixton/backtest/portfolio.py").read_text()
          original_sha=hashlib.sha256(original.encode()).hexdigest()
          changed=instrument(original)
          assert changed!=original and original==(root/"input/native/hixton/backtest/portfolio.py").read_text()
          changed_sha=hashlib.sha256(changed.encode()).hexdigest()
          suite=unittest.defaultTestLoader.discover(str(root/"research/r2_hold001"),"test_hold001.py",top_level_dir=str(root))
          tests=unittest.TextTestRunner(verbosity=2).run(suite)
          status={"candidate":"R2-D1-HOLD-001","status":"PRE_ECON_METHOD_FIXTURE_PASS" if tests.wasSuccessful() and tests.testsRun>=8 else "PRE_ECON_METHOD_FIXTURE_FAILED","tests":tests.testsRun,"failures":len(tests.failures),"errors":len(tests.errors),"product_unchanged":True,"normal_exit_precedence_tested":True,"one_trim_per_defensive_episode_tested":True,"native_model_and_filter_reused":True,"source_commit":"f56d48536525830dd6ea50bf5bc174a6f9aeff8c","native_portfolio_sha256":original_sha,"instrumented_research_sha256":changed_sha,"research_only":True,"financial_candidate_cases_run":0}
          (root/"qa/pre-economic-method-fixtures.json").write_text(json.dumps(status,indent=2)+"\n")
          print("PRE_ECON_QA",json.dumps(status),flush=True)
          if status["status"]!="PRE_ECON_METHOD_FIXTURE_PASS":sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hixton-r2-hold001-preflight-${{ github.run_id }}
          path: qa/
          retention-days: 30
          if-no-files-found: warn
