name: Hixton Key-Free Cloud Swarm Core

on:
  workflow_call:
    inputs:
      mission:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: hixton-key-free-swarm
  cancel-in-progress: false

env:
  BASE_BRANCH: gpt/usdc-audit
  STATE_BRANCH: paper-runtime-state
  PYTHON_VERSION: "3.12"

jobs:
  prepare-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore durable Paper state for independent agent inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime_state
          git fetch --no-tags origin "+refs/heads/${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"
          git show "refs/remotes/origin/${STATE_BRANCH}:state/hixton-usdc.sqlite3.gz" > /tmp/hixton-usdc.sqlite3.gz
          gzip -dc /tmp/hixton-usdc.sqlite3.gz > runtime_state/hixton-usdc.sqlite3
          git show "refs/remotes/origin/${STATE_BRANCH}:state/manifest.json" > runtime_state/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: swarm-paper-state-${{ github.run_id }}
          path: runtime_state
          retention-days: 1
          if-no-files-found: error

  specialists:
    needs: prepare-state
    strategy:
      fail-fast: false
      matrix:
        role: [A01, A02, A03, A04, A05, A06, A07, A08]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build isolated role environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: swarm-paper-state-${{ github.run_id }}
          path: runtime_state
      - name: Run ${{ matrix.role }} without any API secret
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          .venv/bin/python scripts/cloud_swarm_agent.py --role "${{ matrix.role }}" --output "reports/${{ matrix.role }}.json"
      - name: Persist ${{ matrix.role }} evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-report-${{ matrix.role }}-${{ github.run_id }}
          path: reports/${{ matrix.role }}.json
          retention-days: 14
          if-no-files-found: error

  supervisor-a10:
    needs: specialists
    if: always() && needs.specialists.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build supervisor environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: swarm-report-A0*-${{ github.run_id }}
          path: collected
          merge-multiple: true
      - name: A10 audit assignments, failures and repair routing
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          .venv/bin/python scripts/cloud_swarm_agent.py --role A10 --reports-dir collected --output reports/A10.json
      - name: Persist A10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-report-A10-${{ github.run_id }}
          path: reports/A10.json
          retention-days: 14
          if-no-files-found: error

  qa-a09:
    needs: [specialists, supervisor-a10]
    if: always() && needs.supervisor-a10.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build independent QA environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: swarm-report-*-${{ github.run_id }}
          path: collected
          merge-multiple: true
      - name: A09 independent full QA gate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          .venv/bin/python scripts/cloud_swarm_agent.py --role A09 --reports-dir collected --output reports/A09.json
      - name: Persist A09 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-report-A09-${{ github.run_id }}
          path: reports/A09.json
          retention-days: 14
          if-no-files-found: error

  governance-a11:
    needs: [specialists, supervisor-a10, qa-a09]
    if: always() && needs.qa-a09.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build independent governance environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: swarm-report-*-${{ github.run_id }}
          path: collected
          merge-multiple: true
      - name: A11 audit all agents and A10/A09 gates
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          .venv/bin/python scripts/cloud_swarm_agent.py --role A11 --reports-dir collected --output reports/A11.json
      - name: Persist A11 governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-report-A11-${{ github.run_id }}
          path: reports/A11.json
          retention-days: 30
          if-no-files-found: error
