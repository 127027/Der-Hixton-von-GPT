name: Hixton Key-Free Cloud Swarm Core

on:
  workflow_call:
    inputs:
      mission:
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: hixton-key-free-swarm-v2
  # A newer validation targets a newer engineering head. Keeping an obsolete
  # multi-minute backtest alive only delays the exact release candidate.
  cancel-in-progress: true

env:
  BASE_BRANCH: gpt/usdc-audit
  STATE_BRANCH: paper-runtime-state
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lifecycle-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: A10 known-safe lifecycle self-repair
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.swarm_lifecycle
      - name: Persist lifecycle repair only when taskboard changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path="agent_memory/swarm/taskboard.json"
          if git diff --quiet -- "$path"; then
            echo "Lifecycle state already valid; no repository mutation required."
            exit 0
          fi
          changed="$(git diff --name-only)"
          if [ "$changed" != "$path" ]; then
            echo "::error::Lifecycle guard attempted to change an unexpected path: $changed"
            exit 1
          fi
          git config user.name "hixton-swarm[bot]"
          git config user.email "hixton-swarm@users.noreply.github.com"
          git add -- "$path"
          git commit -m "state(swarm): auto-repair stale NEW mission lifecycle"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${BASE_BRANCH}"

  prepare-state:
    needs: lifecycle-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore durable Paper state for independent agent inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime_state
          git fetch --no-tags origin "+refs/heads/${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"
          git show "refs/remotes/origin/${STATE_BRANCH}:state/hixton-usdc.sqlite3.gz" > /tmp/hixton-usdc.sqlite3.gz
          gzip -dc /tmp/hixton-usdc.sqlite3.gz > runtime_state/hixton-usdc.sqlite3
          git show "refs/remotes/origin/${STATE_BRANCH}:state/manifest.json" > runtime_state/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: swarm-paper-state-${{ github.run_id }}
          path: runtime_state
          retention-days: 1
          if-no-files-found: error

  specialists:
    needs: prepare-state
    strategy:
      fail-fast: false
      matrix:
        role: [A01, A03, A04, A05, A06, A07, A08]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build isolated role environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: swarm-paper-state-${{ github.run_id }}
          path: runtime_state
      - name: Set up Node for A04 UI audit
        if: matrix.role == 'A04'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: A04 verify UI source, tests and shipped static bundle
        if: matrix.role == 'A04'
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix ui ci
          npm --prefix ui test
          npm --prefix ui run check
          npm --prefix ui run build
          if [ -n "$(git status --porcelain -- src/hixton/ui/static)" ]; then
            echo "::error::UI build output differs from tracked shipped static bundle."
            git status --short -- src/hixton/ui/static
            git diff -- src/hixton/ui/static || true
            exit 1
          fi
      - name: Run ${{ matrix.role }} without any API secret
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          .venv/bin/python -m scripts.cloud_swarm_agent --role "${{ matrix.role }}" --output "reports/${{ matrix.role }}.json"
      - name: Persist ${{ matrix.role }} evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-report-${{ matrix.role }}-${{ github.run_id }}
          path: reports/${{ matrix.role }}.json
          retention-days: 14
          if-no-files-found: error


  # A02 carries the three compute-heavy release proofs. Run them independently
  # so one slow exact-3Y/optimization segment cannot serialize the whole swarm.
  a02-segments:
    needs: prepare-state
    strategy:
      fail-fast: false
      matrix:
        scope: [base, live, optimization]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build isolated A02 ${{ matrix.scope }} environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
      - name: Run A02 ${{ matrix.scope }} segment
        shell: bash
        run: |
          set -o pipefail
          mkdir -p partials
          .venv/bin/python -m scripts.cloud_swarm_agent \
            --role A02 \
            --scope "${{ matrix.scope }}" \
            --output "partials/A02-${{ matrix.scope }}.json"
      - name: Persist A02 ${{ matrix.scope }} segment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-partial-A02-${{ matrix.scope }}-${{ github.run_id }}
          path: partials/A02-${{ matrix.scope }}.json
          retention-days: 14
          if-no-files-found: error

  a02-aggregate:
    needs: a02-segments
    if: always() && needs.a02-segments.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: swarm-partial-A02-*-${{ github.run_id }}
          path: partials
          merge-multiple: true
      - name: Merge parallel A02 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          paths = sorted(Path("partials").rglob("A02-*.json"))
          if len(paths) != 3:
              raise SystemExit(f"expected 3 A02 segment reports, got {len(paths)}: {paths}")
          parts = [json.loads(path.read_text(encoding="utf-8")) for path in paths]
          evidence = []
          for part in parts:
              value = part.get("evidence")
              if isinstance(value, list):
                  evidence.extend(value)
          failed = [part for part in parts if part.get("verdict") != "PASS"]
          report = {
              "schema_version": 2,
              "agent": "A02",
              "audit_scope": "parallel-full",
              "started_at_utc": min(str(part["started_at_utc"]) for part in parts),
              "finished_at_utc": max(str(part["finished_at_utc"]) for part in parts),
              "execution_mode": "DETERMINISTIC_KEY_FREE",
              "openai_api_key_required": False,
              "binance_private_credentials_required": False,
              "real_money_orders_allowed": False,
              "testnet_orders_allowed": False,
              "verdict": "FAIL" if failed else "PASS",
              "evidence": evidence,
              "segments": {
                  str(part.get("audit_scope")): str(part.get("verdict"))
                  for part in parts
              },
          }
          if failed:
              report["error"] = "; ".join(
                  f"{part.get('audit_scope')}: {part.get('error', 'unknown failure')}"
                  for part in failed
              )
          Path("reports/A02.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, ensure_ascii=False))
          sys.exit(0 if not failed else 1)
          PY
      - name: Persist merged A02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-report-A02-${{ github.run_id }}
          path: reports/A02.json
          retention-days: 14
          if-no-files-found: error

  supervisor-a10:
    needs: [specialists, a02-aggregate]
    if: always() && needs.specialists.result != 'cancelled' && needs.a02-aggregate.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build supervisor environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: swarm-report-A0*-${{ github.run_id }}
          path: collected
          merge-multiple: true
      - name: A10 audit assignments, evidence coverage, failures and repair routing
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          .venv/bin/python -m scripts.cloud_swarm_agent --role A10 --reports-dir collected --output reports/A10.json
      - name: Persist A10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-report-A10-${{ github.run_id }}
          path: reports/A10.json
          retention-days: 14
          if-no-files-found: error
      - name: A10 known-safe product-contract repair
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.swarm_safe_repair --reports-dir collected --output /tmp/A10-repair.json
          cat /tmp/A10-repair.json
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No known-safe product repair was applicable."
            exit 0
          fi
          git config user.name "hixton-swarm[bot]"
          git config user.email "hixton-swarm@users.noreply.github.com"
          git add -- \
            src/hixton/runtime/analysis.py \
            src/hixton/runtime/continuity_supervisor.py \
            tests/test_cli_portfolio.py \
            tests/test_backtest_exact_three_year.py \
            tests/test_usdc_runtime_migration.py \
            ui/index.html \
            ui/src/main.ts \
            ui/tests/backtest-context.test.mjs \
            README.md \
            DMS/18_BACKTEST_STATUS_UND_ERGEBNISFORMAT.md \
            src/hixton/ui/static
          if git diff --cached --quiet; then
            echo "No tracked known-safe repair changes to persist."
            exit 0
          fi
          git commit -m "repair(swarm): enforce current one-winner product contract"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${BASE_BRANCH}"

  qa-a09:
    needs: [specialists, supervisor-a10]
    if: always() && needs.supervisor-a10.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build independent QA environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
          npm --prefix ui ci
      - name: A09 independent UI QA and reproducible bundle gate
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix ui test
          npm --prefix ui run check
          npm --prefix ui run build
          if [ -n "$(git status --porcelain -- src/hixton/ui/static)" ]; then
            echo "::error::UI build output differs from tracked shipped static bundle."
            git status --short -- src/hixton/ui/static
            git diff -- src/hixton/ui/static || true
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: swarm-report-*-${{ github.run_id }}
          path: collected
          merge-multiple: true
      - name: A09 independent full Python QA and upstream evidence gate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          .venv/bin/python -m scripts.cloud_swarm_agent --role A09 --reports-dir collected --output reports/A09.json
      - name: Persist A09 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-report-A09-${{ github.run_id }}
          path: reports/A09.json
          retention-days: 14
          if-no-files-found: error

  governance-a11:
    needs: [specialists, supervisor-a10, qa-a09]
    if: always() && needs.qa-a09.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build independent governance environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: swarm-report-*-${{ github.run_id }}
          path: collected
          merge-multiple: true
      - name: A11 audit all agents, evidence matrix and A10/A09 gates
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          .venv/bin/python -m scripts.cloud_swarm_agent --role A11 --reports-dir collected --output reports/A11.json
      - name: Persist A11 governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-report-A11-${{ github.run_id }}
          path: reports/A11.json
          retention-days: 30
          if-no-files-found: error
