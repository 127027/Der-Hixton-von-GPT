name: Hixton Paper Cloud Core

on:
  workflow_call:

permissions:
  contents: write
  actions: read

# A new primary/backup lease takes over from the old one. The old process has
# already checkpointed the Paper DB at most one lease interval earlier; the new
# process restores that DB and the canonical recovery path catches up finalized
# 1h bars exactly once.
concurrency:
  group: hixton-paper-cloud-runtime
  cancel-in-progress: true

env:
  BASE_BRANCH: gpt/usdc-audit
  STATE_BRANCH: paper-runtime-state
  STATE_TAG: paper-cloud-initialized
  PYTHON_VERSION: "3.12"
  PAPER_LEASE_SECONDS: "21000"
  PAPER_CYCLE_INTERVAL_SECONDS: "900"

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Paper engineering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build isolated Paper virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
          .venv/bin/python -m pytest -q tests/test_cloud_paper_cycle.py

      - name: Restore persistent Paper state or authorize first bootstrap
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          if git ls-remote --exit-code --heads origin "refs/heads/${STATE_BRANCH}" >/dev/null 2>&1; then
            git fetch --no-tags origin "+refs/heads/${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"
            git show "refs/remotes/origin/${STATE_BRANCH}:state/hixton-usdc.sqlite3.gz" > /tmp/hixton-usdc.sqlite3.gz
            gzip -dc /tmp/hixton-usdc.sqlite3.gz > data/hixton-usdc.sqlite3
            git show "refs/remotes/origin/${STATE_BRANCH}:state/manifest.json" > /tmp/previous-manifest.json
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            echo "Restored persistent Paper database from ${STATE_BRANCH}."
          else
            if git ls-remote --exit-code --tags origin "refs/tags/${STATE_TAG}" >/dev/null 2>&1; then
              echo "::error::Paper state branch is missing after prior initialization. Refusing silent 250-USDC reset."
              exit 1
            fi
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "No prior Paper state exists. First cloud Paper account will initialize at the latest market point."
          fi

      - name: Verify restored SQLite state before market access
        if: steps.restore.outputs.bootstrap == 'false'
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path('data/hixton-usdc.sqlite3')
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit('restored Paper database is missing or empty')
          with sqlite3.connect(path) as connection:
              result = connection.execute('PRAGMA integrity_check').fetchone()[0]
          if result != 'ok':
              raise SystemExit(f'SQLite integrity check failed before lease: {result}')
          print('Restored Paper database integrity: OK')
          PY

      - name: Apply exact owner-authorized Paper strategy activation if required
        if: steps.restore.outputs.bootstrap == 'false'
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          import sqlite3
          import subprocess
          from pathlib import Path

          auth = json.loads(
              Path('agent_memory/swarm/paper_activation_authorization.json').read_text(
                  encoding='utf-8'
              )
          )
          config = json.loads(
              Path('config/examples/config.example.json').read_text(encoding='utf-8')
          )
          database = Path('data/hixton-usdc.sqlite3')
          with sqlite3.connect(database) as connection:
              row = connection.execute(
                  'SELECT strategy_key, strategy_version FROM paper_strategy_state WHERE singleton=1'
              ).fetchone()
          if row is None:
              raise SystemExit('Paper strategy state missing; activation refused')
          current_key, current_version = str(row[0]), str(row[1])
          target_key = str(config['strategy']['key'])
          target_version = str(config['strategy']['version'])
          if current_key == target_key and current_version == target_version:
              print(f'Paper strategy already current: {target_key}/{target_version}')
              raise SystemExit(0)
          required = {
              'scope': 'PAPER_ONLY_CONTROLLED_STRATEGY_ACTIVATION',
              'strategy_key': target_key,
              'authorized_from_strategy_version': current_version,
              'authorized_to_strategy_version': target_version,
              'confirmation': 'AKTIVIEREN',
              'preserve_history': True,
              'fresh_start_allowed': False,
              'real_money_orders_allowed': False,
              'testnet_orders_allowed': False,
          }
          mismatches = {
              key: (auth.get(key), expected)
              for key, expected in required.items()
              if auth.get(key) != expected
          }
          if mismatches:
              raise SystemExit(
                  'Paper strategy mismatch has no exact owner authorization: '
                  + json.dumps(mismatches, sort_keys=True)
              )
          subprocess.run(
              [
                  '.venv/bin/hixton',
                  '--config',
                  'config/examples/config.example.json',
                  'paper-activate',
                  '--strategy',
                  target_key,
                  '--confirmation',
                  'AKTIVIEREN',
              ],
              check=True,
          )
          with sqlite3.connect(database) as connection:
              activated = connection.execute(
                  'SELECT strategy_key, strategy_version FROM paper_strategy_state WHERE singleton=1'
              ).fetchone()
          if activated != (target_key, target_version):
              raise SystemExit(
                  f'Paper activation verification failed: {activated!r} != '
                  f'{(target_key, target_version)!r}'
              )
          print(
              'Exact owner-authorized Paper activation completed; '
              'ledger history preserved and future version drift remains fail-closed.'
          )
          PY

      - name: Run durable real-Binance Paper lease
        shell: bash
        env:
          HIXTON_TRADING_MODE: PAPER_ONLY
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ steps.restore.outputs.bootstrap }}
        run: |
          set -euo pipefail

          lease_started="$(date +%s)"
          lease_deadline="$((lease_started + PAPER_LEASE_SECONDS))"
          cycle=0
          state_dir="$(mktemp -d)"
          git -C "$state_dir" init -b "$STATE_BRANCH"
          git -C "$state_dir" config user.name "hixton-paper[bot]"
          git -C "$state_dir" config user.email "hixton-paper@users.noreply.github.com"
          git -C "$state_dir" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          persist_cycle() {
            cycle="$((cycle + 1))"
            export PAPER_LEASE_CYCLE="$cycle"
            echo "[Hixton Paper] Lease cycle ${cycle} starting at $(date -u +%FT%TZ)"

            timeout 30m .venv/bin/python scripts/cloud_paper_cycle.py > /tmp/paper-summary.json
            cat /tmp/paper-summary.json

            .venv/bin/python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          path = Path('data/hixton-usdc.sqlite3')
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit('Paper cycle did not produce a database')
          with sqlite3.connect(path) as connection:
              connection.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchall()
              result = connection.execute('PRAGMA integrity_check').fetchone()[0]
          if result != 'ok':
              raise SystemExit(f'SQLite integrity check failed after cycle: {result}')

          summary = json.loads(Path('/tmp/paper-summary.json').read_text(encoding='utf-8'))
          required = {
              'mode': 'PAPER_ONLY',
              'market_data': 'BINANCE_PUBLIC_USDC',
              'market_data_base_url': 'https://data-api.binance.vision',
              'real_money_orders_allowed': False,
              'testnet_orders_allowed': False,
          }
          for key, expected in required.items():
              if summary.get(key) != expected:
                  raise SystemExit(f'Paper invariant failed: {key}={summary.get(key)!r}, expected {expected!r}')
          print('Paper-only post-cycle invariants: OK')
          PY

            gzip -9 -c data/hixton-usdc.sqlite3 > /tmp/hixton-usdc.sqlite3.gz
            packed_size="$(stat -c %s /tmp/hixton-usdc.sqlite3.gz)"
            if [ "$packed_size" -ge 95000000 ]; then
              echo "::error::Compressed Paper database is too large for safe GitHub state storage (${packed_size} bytes)."
              exit 1
            fi

            .venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          db = Path('data/hixton-usdc.sqlite3')
          packed = Path('/tmp/hixton-usdc.sqlite3.gz')
          summary = json.loads(Path('/tmp/paper-summary.json').read_text(encoding='utf-8'))
          source_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          previous = None
          previous_path = Path('/tmp/previous-manifest.json')
          if previous_path.exists():
              previous = json.loads(previous_path.read_text(encoding='utf-8'))
          manifest = {
              'schema_version': 2,
              'mode': 'PAPER_ONLY',
              'market_data': 'BINANCE_PUBLIC_USDC',
              'source_branch': os.environ['BASE_BRANCH'],
              'source_commit': source_commit,
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'lease_cycle': int(os.environ['PAPER_LEASE_CYCLE']),
              'saved_at_utc': datetime.now(UTC).isoformat(),
              'database_sha256': hashlib.sha256(db.read_bytes()).hexdigest(),
              'compressed_sha256': hashlib.sha256(packed.read_bytes()).hexdigest(),
              'previous_workflow_run_id': previous.get('workflow_run_id') if previous else None,
              'previous_lease_cycle': previous.get('lease_cycle') if previous else None,
              'paper_summary': summary,
              'real_money_orders_allowed': False,
              'testnet_orders_allowed': False,
          }
          Path('/tmp/manifest.json').write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY

            rm -rf "$state_dir/state"
            mkdir -p "$state_dir/state"
            cp /tmp/hixton-usdc.sqlite3.gz "$state_dir/state/hixton-usdc.sqlite3.gz"
            cp /tmp/manifest.json "$state_dir/state/manifest.json"
            cat > "$state_dir/README.md" <<'EOF'
          # Hixton Paper runtime state

          Machine-managed state for the GitHub-hosted Paper-only runtime.
          Contains public Binance market candles and simulated Paper account state only.
          Never add Binance credentials or real-order data here.
          EOF
            git -C "$state_dir" add -A
            if git -C "$state_dir" rev-parse --verify HEAD >/dev/null 2>&1; then
              git -C "$state_dir" commit --amend --no-edit
            else
              git -C "$state_dir" commit -m "state(paper): persist cloud Paper lease ${GITHUB_RUN_ID}"
            fi

            if [ "$BOOTSTRAP" = "true" ] && [ "$cycle" -eq 1 ]; then
              git -C "$state_dir" tag "$STATE_TAG"
              git -C "$state_dir" push origin "refs/tags/${STATE_TAG}"
            fi
            git -C "$state_dir" push --force origin "HEAD:refs/heads/${STATE_BRANCH}"
            cp /tmp/manifest.json /tmp/previous-manifest.json
            echo "[Hixton Paper] Lease cycle ${cycle} persisted at $(date -u +%FT%TZ)"
          }

          while true; do
            persist_cycle
            now="$(date +%s)"
            if [ "$((now + PAPER_CYCLE_INTERVAL_SECONDS))" -ge "$lease_deadline" ]; then
              echo "[Hixton Paper] Lease handoff window reached after ${cycle} durable cycles."
              break
            fi
            sleep "$PAPER_CYCLE_INTERVAL_SECONDS"
          done

      - name: Upload final lease evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: hixton-paper-lease-${{ github.run_id }}
          path: |
            /tmp/paper-summary.json
            /tmp/manifest.json
          retention-days: 7
          if-no-files-found: error
