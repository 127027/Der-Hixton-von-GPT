name: Hixton Shared Gap Guard Search

on:
  push:
    branches:
      - gpt/15coin-satellite-integration
    paths:
      - .github/workflows/hixton-shared-gap-guard.yml
      - scripts/optimize_shared_gap_guard.py
      - src/hixton/backtest/satellite_portfolio.py
      - src/hixton/domain/satellite_layer.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hixton-shared-gap-guard
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: gpt/15coin-satellite-integration
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked project environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m py_compile scripts/optimize_shared_gap_guard.py
          .venv/bin/ruff check scripts/optimize_shared_gap_guard.py

      - name: Search robust shared gap filler
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/optimize_shared_gap_guard.py

      - name: Upload search evidence
        uses: actions/upload-artifact@v4
        with:
          name: hixton-shared-gap-guard-${{ github.run_id }}
          path: evidence/shared-gap-guard-optimization.json
          retention-days: 30
          if-no-files-found: error
