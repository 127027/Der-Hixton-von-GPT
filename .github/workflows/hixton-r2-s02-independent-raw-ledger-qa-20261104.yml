name: Hixton S02 Independent Read-Only Paired Raw Ledger QA
on:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths: [".github/workflows/hixton-r2-s02-independent-raw-ledger-qa-20261104.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-provenance-time-cash-fills-reentry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HIXTON_RESEARCH_ONLY: "1"
      HIXTON_NO_TRADING: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve existing fixed input/result artifacts, without native replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p existing current audit
          gh run download 41889629161 -R "$GH_REPO" -n hixton-r2-s02-paired-native-41889629161 -D current
          gh run download 41873929231 -R "$GH_REPO" -n hixton-r2-s01-a-current-ledger-evidence-41873929231 -D existing
          test -s current/C0-native-hourly.json.gz
          test -s current/S01-native-hourly.json.gz
          test -s current/S02-DIAG-002-Report.json
          test -s existing/S01-A-current-active-native.json
      - name: Independent Dot4 limited-scope QA of real hourly C0 and S01 native raw state, not method promotion
        run: |
          python -m research.r2_s01.s02_independent_hourly_qa --control current/C0-native-hourly.json.gz --candidate current/S01-native-hourly.json.gz --report current/S02-DIAG-002-Report.json --old existing/S01-A-current-active-native.json --output audit/S02-DIAG-002-independent-Dot4-QA.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hixton-r2-s02-independent-qa-${{ github.run_id }}
          path: audit/
          retention-days: 30
          if-no-files-found: warn
