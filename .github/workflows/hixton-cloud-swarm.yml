name: Hixton Cloud Swarm

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hixton-cloud-swarm.yml
  workflow_dispatch:
    inputs:
      mission:
        description: Optional owner mission override; empty uses active taskboard mission
        required: false
        type: string
        default: ""
  schedule:
    - cron: "17 */6 * * *"

# Key-free engineering swarm for the Paper-only bot. It receives no Binance
# credentials and no OpenAI/API secret. The only autonomous repository write
# permitted by this workflow is the known-safe taskboard NEW -> IN_PROGRESS
# lifecycle normalization. Mission-specific evidence is mandatory at A10, A09
# and A11; a bare specialist PASS can no longer satisfy the workflow.
# 2026-09-16: launch after fresh dual-quote and three-year continuity evidence.
# 2026-09-17: launch after canonical single-system dashboard backtest integration.
# 2026-09-18: launch after owner removal of permanent 20-percent portfolio drawdown halt.
# 2026-09-18: relaunch after obsolete 20-percent-halt regression tests and wording were repaired.
permissions:
  contents: write
  actions: read

jobs:
  cloud-swarm:
    uses: 127027/Der-Hixton-von-GPT/.github/workflows/hixton-cloud-swarm-reusable.yml@gpt/usdc-audit
    with:
      mission: ${{ inputs.mission }}
