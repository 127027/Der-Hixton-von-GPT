name: Hixton Cloud Swarm

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hixton-cloud-swarm.yml
  workflow_dispatch:
    inputs:
      mission:
        description: Optional owner mission override; empty uses active taskboard mission
        required: false
        type: string
        default: ""
  schedule:
    - cron: "17 */6 * * *"

# Key-free engineering swarm for the Paper-only bot. It receives no Binance
# credentials and no OpenAI/API secret. A04/A09 verify UI; A09/A11 gate every clean run.
# Owner migration verification trigger: 2026-09-16 USDT->USDC full audit/retest.
permissions:
  contents: read
  actions: read

jobs:
  cloud-swarm:
    uses: 127027/Der-Hixton-von-GPT/.github/workflows/hixton-cloud-swarm-reusable.yml@gpt/usdc-audit
    with:
      mission: ${{ inputs.mission }}
