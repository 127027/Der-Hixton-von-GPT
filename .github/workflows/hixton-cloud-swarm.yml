name: Hixton Cloud Swarm

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hixton-cloud-swarm.yml
  workflow_dispatch:
    inputs:
      mission:
        description: Optional owner mission override; empty uses active taskboard mission
        required: false
        type: string
        default: ""
  schedule:
    - cron: "17 */6 * * *"

# Key-free engineering swarm for the Paper-only bot. It receives no Binance
# credentials and no OpenAI/API secret. The only autonomous repository write
# permitted by this workflow is the known-safe taskboard NEW -> IN_PROGRESS
# lifecycle normalization. A09/A11 still gate every clean run; no auto-merge.
permissions:
  contents: write
  actions: read

jobs:
  cloud-swarm:
    uses: 127027/Der-Hixton-von-GPT/.github/workflows/hixton-cloud-swarm-reusable.yml@gpt/usdc-audit
    with:
      mission: ${{ inputs.mission }}
