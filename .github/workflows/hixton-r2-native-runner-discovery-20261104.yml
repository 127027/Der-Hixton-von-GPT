name: Hixton R2 Native Input Read-Only Inventory
on:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths: [".github/workflows/hixton-r2-native-runner-discovery-20261104.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-candle-volume-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HIXTON_RESEARCH_ONLY: "1"
      HIXTON_NO_TRADING: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only NPZ array reader
        run: python -m pip install numpy==2.2.6
      - name: Fetch exact previously authorized original input release with original archive SHA checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle audit
          gh release download research-data-20261103-five-dot-inputs -R "$GH_REPO" -p Hixton-Loss-Handoff-20261102.zip -p Hixton-Five-Synthetic-Worlds-20261103.zip -D bundle
          echo "d1d1cde8347665d74da71f9e44bb3876dc6662bfe4bfc9e34dcab1dfecd84308  bundle/Hixton-Loss-Handoff-20261102.zip" | sha256sum -c
          echo "5262f12bef7182ae10e2c85fe5b790263404764e98e759196dbdfb7d0970d278  bundle/Hixton-Five-Synthetic-Worlds-20261103.zip" | sha256sum -c
      - name: Count original per-window and per-coin candle volume data, no trading engine
        shell: bash
        run: |
          set -euo pipefail
          python research/r2_s01/r2_scale_liq_candle_inventory.py \
            --historical bundle/Hixton-Loss-Handoff-20261102.zip \
            --synthetic bundle/Hixton-Five-Synthetic-Worlds-20261103.zip \
            --output audit/r2-scale-liq-original-candle-inventory.json
      - name: Upload only bounded summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hixton-r2-scale-liq-candle-inventory-${{ github.run_id }}
          path: audit/r2-scale-liq-original-candle-inventory.json
          retention-days: 30
          if-no-files-found: warn
