name: Hixton R2 S01 Native C0 Real-Held-Positions Causal Diagnostic
on:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths: [".github/workflows/hixton-r2-s01-native-position-observer-20261104.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen-c0-observe-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HIXTON_RESEARCH_ONLY: "1"
      HIXTON_NO_TRADING: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Verify frozen original 3y archive and extract without mutating source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive extracted audit
          gh release download research-data-20261103-five-dot-inputs -R "$GH_REPO" -p Hixton-Loss-Handoff-20261102.zip -D archive
          echo "d1d1cde8347665d74da71f9e44bb3876dc6662bfe4bfc9e34dcab1dfecd84308  archive/Hixton-Loss-Handoff-20261102.zip" | sha256sum -c
          python3 - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path("extracted").resolve()
          with zipfile.ZipFile("archive/Hixton-Loss-Handoff-20261102.zip") as z:
            if not all((root/x.filename).resolve().is_relative_to(root) for x in z.infolist()):
              raise RuntimeError("ZIP_PATH_ESCAPE")
            z.extractall(root)
          PY
      - name: Read native actual positions and causal closed-EMA warnings on one historical frozen C0 control
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m research.r2_s01.native_frozen_c0_position_observer \
            --bundle extracted/Hixton-Loss-Handoff-20261102 \
            --window original_32k --cost current \
            --output audit/native-original32k-current-regular-position-S01-feature-observation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hixton-r2-s01-native-position-observer-${{ github.run_id }}
          path: audit/
          retention-days: 30
          if-no-files-found: warn
