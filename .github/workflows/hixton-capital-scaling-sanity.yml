name: Hixton Capital Scaling Sanity

on:
  workflow_dispatch:
  push:
    branches: [gpt/usdc-audit]
    paths:
      - "scripts/capital_scaling_sanity.py"
      - ".github/workflows/hixton-capital-scaling-sanity.yml"

permissions:
  contents: read

jobs:
  scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - run: |
          python -m py_compile scripts/capital_scaling_sanity.py
          ruff check scripts/capital_scaling_sanity.py
      - run: python -m scripts.capital_scaling_sanity
      - uses: actions/upload-artifact@v4
        with:
          name: hixton-capital-scaling-sanity
          path: evidence/capital-scaling-sanity.json
          retention-days: 14
