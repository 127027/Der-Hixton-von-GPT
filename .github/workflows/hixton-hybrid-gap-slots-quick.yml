name: Hixton Hybrid Gap Slot Quick

on:
  push:
    branches:
      - gpt/15coin-satellite-integration
    paths:
      - scripts/research_hybrid_gap_slots_quick.py
      - .github/workflows/hixton-hybrid-gap-slots-quick.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/15coin-satellite-integration
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: Validate
        run: |
          .venv/bin/python -m py_compile scripts/research_hybrid_gap_slots_quick.py
          .venv/bin/ruff check scripts/research_hybrid_gap_slots_quick.py
      - name: Run
        run: .venv/bin/python scripts/research_hybrid_gap_slots_quick.py
      - uses: actions/upload-artifact@v4
        with:
          name: hixton-hybrid-gap-quick
          path: evidence/hybrid-gap-slot-quick.json
          retention-days: 30
