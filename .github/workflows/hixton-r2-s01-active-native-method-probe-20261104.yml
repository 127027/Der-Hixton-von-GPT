name: Hixton R2 S01 Activated Native Finance-Method Probe
on:
  workflow_dispatch:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths: [".github/workflows/hixton-r2-s01-active-native-method-probe-20261104.yml"]
permissions:
  contents: read
  actions: read
jobs:
  activated-native-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HIXTON_RESEARCH_ONLY: "1"
      HIXTON_NO_TRADING: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.3.5
      - name: Verify immutable original archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive extracted audit
          gh release download research-data-20261103-five-dot-inputs -R "$GH_REPO" -p Hixton-Loss-Handoff-20261102.zip -D archive
          echo "d1d1cde8347665d74da71f9e44bb3876dc6662bfe4bfc9e34dcab1dfecd84308  archive/Hixton-Loss-Handoff-20261102.zip" | sha256sum -c
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path("extracted").resolve()
          with zipfile.ZipFile("archive/Hixton-Loss-Handoff-20261102.zip") as z:
              if not all((root/x.filename).resolve().is_relative_to(root) for x in z.infolist()):
                  raise RuntimeError("ZIP_PATH_ESCAPE")
              z.extractall(root)
          PY
      - name: Verify static predicate and native structure fixtures
        run: |
          PYTHONPATH="extracted/Hixton-Loss-Handoff-20261102/engine/src:." python -m research.r2_s01.native_method_fixtures extracted/Hixton-Loss-Handoff-20261102
      - name: Enabled S01 original_32k normal native replay (method evidence, not 16-context promotion)
        run: |
          python -m research.r2_s01.run_native_s01 --bundle extracted/Hixton-Loss-Handoff-20261102 --window original_32k --cost current --mode candidate --output audit/s01-activated-original32k-current.json
      - name: Inspect genuine native S01 fill evidence and accounting fields
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("audit/s01-activated-original32k-current.json")
          x=json.loads(p.read_text())
          events=x["s01_events"]
          counts={name:sum(z["kind"]==name for z in events) for name in sorted({z["kind"] for z in events})}
          summary={"status":"ACTIVATED_NATIVE_METHOD_OBSERVATION_ONLY","counts":counts,
            "native_fills":x["native_fill_count"],"native_trades":x["native_trade_count"],
            "native_fees":x["native_total_fees"],"C0":x["C0_ending_equity_usdc"],
            "candidate":x["candidate_ending_equity_usdc"],"delta":x["ending_equity_delta_usdc"]}
          pathlib.Path("audit/S01-activated-probe-summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print("S01_ACTIVATED_NATIVE_PROBE",json.dumps(summary),flush=True)
          if counts.get("FILLED_NATIVE_FULL_EXIT",0)<1:
              raise RuntimeError("S01_NO_ACTUAL_NATIVE_EXITS_OBSERVED")
          if x["native_total_fees"] is None:
              raise RuntimeError("S01_MISSING_NATIVE_FEES")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hixton-r2-s01-activated-native-probe-${{ github.run_id }}
          path: audit/
          retention-days: 30
          if-no-files-found: warn
