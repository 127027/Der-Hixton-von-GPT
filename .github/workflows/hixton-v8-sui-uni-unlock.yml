name: Hixton V8 SUI-UNI Research-Only Gate Experiment

on:
  push:
    branches: [codex/hixton-research-20261011]
    paths:
      - .github/workflows/hixton-v8-sui-uni-unlock.yml
      - scripts/research_v8_sui_uni_unlock_20261011.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a02-a08-temporary-gate-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fresh isolated Python venv; no credentials
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
          .venv/bin/python -m py_compile scripts/research_v8_sui_uni_unlock_20261011.py
      - name: V6/V8 regression verification before research
        shell: bash
        run: |
          .venv/bin/python -m pytest -q tests/test_v8_product_backtest.py tests/test_current_v6_product_contract.py
      - name: Restore cached public-only historical market candles
        id: candles
        uses: actions/cache@v4
        with:
          path: data/
          key: hixton-keyfree-public-15-20261010-19-v1
      - name: A07 public data fallback only on cache miss
        if: steps.candles.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          .venv/bin/python - <<'PY' | tee evidence/data-restore.log
          from datetime import UTC, datetime, timedelta
          from pathlib import Path
          from hixton.data.binance import BinancePublicClient
          from hixton.data.storage import CandleStore
          from hixton.data.sync import synchronize_symbol
          from hixton.domain.versions import strategy_definition
          end=datetime(2026,10,10,19,tzinfo=UTC)
          start=end.replace(year=end.year-3)-timedelta(hours=400)
          client=BinancePublicClient(base_url="https://data-api.binance.vision")
          with CandleStore(Path("data/hixton-usdc.sqlite3")) as db:
            for symbol in strategy_definition("v8").symbols:
              first=client.first_available_open(symbol,start=start,end_exclusive=end)
              done=synchronize_symbol(client=client,store=db,symbol=symbol,start=first,end_exclusive=end)
              print(symbol,done.quality.candle_count,flush=True)
          PY
      - name: A02 explicit in-memory SUI-UNI research simulation, no runtime changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          .venv/bin/python scripts/research_v8_sui_uni_unlock_20261011.py \
            --end 2026-10-10T19:00:00Z \
            --output evidence/research-v8-sui-uni-unlock-20261011.json | tee evidence/sui-uni-experiment.log
      - name: A08 independent regression and role-gate integrity assertions
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import json
          p=json.load(open("evidence/research-v8-sui-uni-unlock-20261011.json"))
          assert p["canonical_baseline_reproduced"] and p["canonical_gate_restored"]
          assert p["temporary_in_memory_gate_override"]
          assert p["strategy_source_unchanged"] and p["no_order_requests"]
          baseline=p["experiments"]["baseline"]
          for key,v in p["experiments"].items():
            print(key,v["scenarios"]["current"]["ending_equity"],
                  v["scenarios"]["current"]["trades"],
                  v["deltas"]["current"]["delta_end_usdc"],
                  v["deltas"]["stress"]["delta_end_usdc"])
          PY
      - name: Archive evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hixton-v8-sui-uni-research-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
