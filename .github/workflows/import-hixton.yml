# Triggered after workflow existed on default branch.
name: Import Hixton source

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-hixton.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Import exact source branch into GPT work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add hixton-source https://github.com/127027/Der-Hixton.git
          git fetch --depth=1 hixton-source codex/backtest-audit-20260915
          git checkout -B gpt/usdc-audit
          git rm -r --ignore-unmatch .
          git checkout FETCH_HEAD -- .
          git add -A
          git commit -m "chore: import codex/backtest-audit-20260915 baseline"
          git push --force origin gpt/usdc-audit
