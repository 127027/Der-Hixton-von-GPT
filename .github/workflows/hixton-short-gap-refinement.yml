name: Hixton Short Gap Satellite Refinement

on:
  push:
    branches:
      - gpt/15coin-satellite-integration
    paths:
      - .github/workflows/hixton-short-gap-refinement.yml
      - scripts/optimize_short_gap_satellites.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hixton-short-gap-refinement
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/15coin-satellite-integration
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
      - name: Static
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m py_compile scripts/optimize_short_gap_satellites.py
          .venv/bin/ruff check scripts/optimize_short_gap_satellites.py
      - name: Run preemption-aware short-gap search
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/optimize_short_gap_satellites.py
      - uses: actions/upload-artifact@v4
        with:
          name: hixton-short-gap-refinement-${{ github.run_id }}
          path: evidence/short-gap-satellite-refinement.json
          retention-days: 30
          if-no-files-found: error
