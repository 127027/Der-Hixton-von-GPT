name: Hixton R2 S01 Full Sixteen Disabled-C0 Identity Matrix
on:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths: [".github/workflows/hixton-r2-s01-sixteen-c0-controls-20261104.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  all-sixteen-native-disabled-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HIXTON_RESEARCH_ONLY: "1"
      HIXTON_NO_TRADING: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Fetch both frozen original archives and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive extracted output
          gh release download research-data-20261103-five-dot-inputs -R "$GH_REPO" -p Hixton-Loss-Handoff-20261102.zip -p Hixton-Five-Synthetic-Worlds-20261103.zip -D archive
          echo "d1d1cde8347665d74da71f9e44bb3876dc6662bfe4bfc9e34dcab1dfecd84308  archive/Hixton-Loss-Handoff-20261102.zip" | sha256sum -c
          echo "5262f12bef7182ae10e2c85fe5b790263404764e98e759196dbdfb7d0970d278  archive/Hixton-Five-Synthetic-Worlds-20261103.zip" | sha256sum -c
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path("extracted").resolve()
          for file in sorted(pathlib.Path("archive").glob("*.zip")):
              with zipfile.ZipFile(file) as z:
                  if not all((root/x.filename).resolve().is_relative_to(root) for x in z.infolist()):
                      raise RuntimeError("ZIP_PATH_ESCAPE")
                  z.extractall(root)
          PY
      - name: Verify all 16 exact f56 baseline metrics, signals, fills, trades and each hourly cash/equity row
        shell: bash
        run: |
          set -euo pipefail
          n=0
          for w in original_32k current_26oct latest_long; do
            for c in current stress; do
              python -m research.r2_s01.run_native_s01 --bundle extracted/Hixton-Loss-Handoff-20261102 --window "$w" --cost "$c" --mode control --output "output/${w}__${c}.json"
              n=$((n+1))
            done
          done
          for w in cycles winter whipsaw rotation tail; do
            for c in current stress; do
              python -m research.r2_s01.run_native_s01 --bundle extracted/Hixton-Five-Synthetic-Worlds-20261103 --window "$w" --cost "$c" --mode control --output "output/${w}__${c}.json"
              n=$((n+1))
            done
          done
          test "$n" -eq 16
          python - <<'PY'
          import json,pathlib
          cases=list(pathlib.Path("output").glob("*.json"))
          assert len(cases)==16
          assert all(json.loads(p.read_text())["status"]=="C0_EXACT_PARITY" for p in cases)
          print("S01_DISABLED_16_OF_16_EXACT_FROZEN_C0_LEDGER_PARITY_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hixton-r2-s01-disabled-frozen-c0-matrix-${{ github.run_id }}
          path: output/
          retention-days: 30
          if-no-files-found: warn
