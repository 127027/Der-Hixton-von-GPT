name: Hixton S04 Coin Concentration and Paired Drawdown Episode Diagnostics
on:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths: [".github/workflows/hixton-r2-s04-concentration-drawdown-20261104.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-original-hourly-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HIXTON_NO_TRADING: "1"
      HIXTON_RESEARCH_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.3.5
      - name: Reuse frozen source and earlier native original C0/S01 hourly artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s research/r2_s01/R2-S04-CONCENTRATION-001-prereg-20261104.md
          mkdir -p archive extracted native old output
          gh release download research-data-20261103-five-dot-inputs -R "$GH_REPO" -p Hixton-Loss-Handoff-20261102.zip -D archive
          echo "d1d1cde8347665d74da71f9e44bb3876dc6662bfe4bfc9e34dcab1dfecd84308  archive/Hixton-Loss-Handoff-20261102.zip" | sha256sum -c
          gh run download 41889629161 -R "$GH_REPO" -n hixton-r2-s02-paired-native-41889629161 -D native
          gh run download 41873929231 -R "$GH_REPO" -n hixton-r2-s01-a-current-ledger-evidence-41873929231 -D old
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path("extracted").resolve()
          with zipfile.ZipFile("archive/Hixton-Loss-Handoff-20261102.zip") as z:
              if not all((root/x.filename).resolve().is_relative_to(root) for x in z.infolist()):raise RuntimeError("ZIP_PATH_ESCAPE")
              z.extractall(root)
          PY
      - name: Native original HWM peak-trough and hourly two-denominator concentration analysis
        run: |
          python -m research.r2_s01.s04_concentration_drawdowns --bundle extracted/Hixton-Loss-Handoff-20261102 --control native/C0-native-hourly.json.gz --candidate native/S01-native-hourly.json.gz --previous-s01 old/S01-A-current-active-native.json --output output/S04-CONCENTRATION-001-native-drawdowns.json
      - name: Fail closed on time/data mismatch and missing 52 sale windows
        run: |
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path("output/S04-CONCENTRATION-001-native-drawdowns.json").read_text())
          assert x["row_count"]==26304 and x["sale_event_count"]==52
          for side in ("C0","S01"):
              s=x[side+"_summary"]
              assert s["cash_only_hours"]+s["dust_only_no_regular_hours"]+s["regular_position_hours"]==26304
              for k in ("max_absolute","max_percentage"):
                  assert x[side+"_drawdown_episodes"][k]["trough_utc"]
          assert len(x["matched_utc_episode_windows"])==4
          assert x["causal_protected_wealth_not_estimated"]
          print("S04_NATIVE_TWO_DENOM_CONCENTRATION_DD_PREDECLARED_CHECK_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hixton-s04-concentration-drawdown-${{ github.run_id }}
          path: output/
          retention-days: 30
          if-no-files-found: warn
