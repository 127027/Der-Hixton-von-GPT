name: Hixton V8 Research - 13 Shared Portfolio Ablations

on:
  push:
    branches: [codex/hixton-research-20261011]
    paths:
      - .github/workflows/hixton-v8-research-ablation.yml
      - scripts/research_v8_filler_ablation_20261011.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a02-a07-quantitative-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout research branch (source strategy unchanged)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Key-free isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: A06 V8 backtest and unchanged V6 regression tests
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m py_compile scripts/research_v8_filler_ablation_20261011.py
          .venv/bin/python -m pytest -q tests/test_v8_product_backtest.py tests/test_backtest_exact_three_year.py tests/test_current_v6_product_contract.py
      - name: Restore or cache public candle history only (no account credentials)
        uses: actions/cache@v4
        with:
          path: data/
          key: hixton-keyfree-public-15-20261010-19-v1
      - name: A07 synchronize all 15 USDC markets from Binance Vision public API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          .venv/bin/python - <<'PY' | tee evidence/a07-public-market-data.log
          from datetime import UTC, datetime, timedelta
          from pathlib import Path
          from hixton.data.binance import BinancePublicClient
          from hixton.data.storage import CandleStore
          from hixton.data.sync import synchronize_symbol
          from hixton.domain.versions import strategy_definition
          end = datetime(2026,10,10,19,tzinfo=UTC)
          start = end.replace(year=end.year-3)-timedelta(hours=400)
          client = BinancePublicClient(base_url="https://data-api.binance.vision")
          with CandleStore(Path("data/hixton-usdc.sqlite3")) as store:
              for symbol in strategy_definition("v8").symbols:
                  first=client.first_available_open(symbol,start=start,end_exclusive=end)
                  synced=synchronize_symbol(
                      client=client,store=store,symbol=symbol,
                      start=first,end_exclusive=end)
                  print(symbol,first.isoformat(),synced.quality.candle_count,flush=True)
          PY
      - name: A02 backtest 13 configurations x normal and stress costs
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/research_v8_filler_ablation_20261011.py \
            --end 2026-10-10T19:00:00Z \
            --output evidence/research-v8-ablation-20261011.json | tee evidence/a02-experiments.log
      - name: A08 independent mechanical comparison (not QA approval)
        shell: bash
        if: success()
        run: |
          .venv/bin/python - <<'PY'
          import json
          p=json.load(open("evidence/research-v8-ablation-20261011.json"))
          baseline=p["scenarios"]["baseline"]
          print("BASELINE",baseline["scenarios"]["current"]["ending_equity"])
          for name,row in p["scenarios"].items():
              c=row["versus_baseline"]["current"]; s=row["versus_baseline"]["stress"]
              print(name, "vs normal",c["delta_end_usdc"],
                    "vs stress",s["delta_end_usdc"],
                    "extra trades",c["delta_trades"],
                    "dd pp",c["delta_drawdown_pp"],
                    "year3 difference",c["delta_year3_pnl_usdc"])
          assert p["canonical_baseline_matches_prior_run"], "No candidate allowed without exact baseline"
          assert p["orders_sent"] is False
          assert p["status"]=="RESEARCH_ONLY_NOT_OOS_OR_RELEASE_APPROVED"
          PY
      - name: Upload research-only evidence regardless of failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hixton-v8-shared250-ablation-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
