name: Hixton R2 S01-A Current-Code Native One-Context Method Evidence
on:
  push:
    branches: [research/hixton-native-baseline-proof-20261103]
    paths: [".github/workflows/hixton-r2-s01-current-method-ledger-20261104.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  enabled-native-s01-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HIXTON_NO_TRADING: "1"
      HIXTON_RESEARCH_ONLY: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.3.5
      - name: Original native input cryptographic check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive extracted output
          gh release download research-data-20261103-five-dot-inputs -R "$GH_REPO" -p Hixton-Loss-Handoff-20261102.zip -D archive
          echo "d1d1cde8347665d74da71f9e44bb3876dc6662bfe4bfc9e34dcab1dfecd84308  archive/Hixton-Loss-Handoff-20261102.zip" | sha256sum -c
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path("extracted").resolve()
          with zipfile.ZipFile("archive/Hixton-Loss-Handoff-20261102.zip") as z:
              if not all((root/x.filename).resolve().is_relative_to(root) for x in z.infolist()):
                  raise RuntimeError("ZIP_PATH_ESCAPE")
              z.extractall(root)
          PY
      - name: New Dot3 native prefix, gaps, original structure, rejection, unknown-state fixtures
        shell: bash
        run: |
          PYTHONPATH="extracted/Hixton-Loss-Handoff-20261102/engine/src:." python -m research.r2_s01.native_method_fixtures extracted/Hixton-Loss-Handoff-20261102
      - name: Single enabled current S01-A replay and separately authored native Fill-Trade ledger reconciliation
        run: |
          python -m research.r2_s01.run_native_s01 --bundle extracted/Hixton-Loss-Handoff-20261102 --window original_32k --cost current --mode candidate --output output/S01-A-current-active-native.json
      - name: Require actual native S01 sales with reconciled fee basis cash dust slots and compare old study
        run: |
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path("output/S01-A-current-active-native.json").read_text())
          qa=x["native_s01_fill_trade_ledger_audit"]
          n=qa["native_confirmed_s01_exits"]
          if n<1 or n!=x["s01_executed_count"]:
              raise RuntimeError("NO_CONFIRMED_OR_UNRECONCILED_S01_NATIVE_FULL_EXIT")
          if qa["status"]!="NATIVE_EVENT_LEDGER_RECONCILED":
              raise RuntimeError("S01_FINANCIAL_LEDGER_INVALID")
          old_end="10967.68139761524970000000"
          comparison={"current_candidate_end":x["candidate_ending_equity_usdc"],
              "old_candidate_end":old_end,
              "old_vs_current_exact_ending_equity":
                 str(x["candidate_ending_equity_usdc"])==old_end,
              "actual_native_s01_confirmed_full_exits":n,
              "independent_ledger_script_pass":True,
              "method_signoff":"PENDING_INDEPENDENT_DOT4_REVIEW",
              "live_change":False}
          pathlib.Path("output/Current-Versus-Old-Result-Check.json").write_text(json.dumps(comparison,indent=2,default=str)+"\n")
          print("CURRENT_S01_METHOD_LEDGER_EVIDENCE",json.dumps(comparison,default=str),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hixton-r2-s01-a-current-ledger-evidence-${{ github.run_id }}
          path: output/
          retention-days: 30
          if-no-files-found: warn
