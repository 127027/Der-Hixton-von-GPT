name: Hixton 15-Coin Candidate Swarm

on:
  push:
    branches:
      - gpt/15coin-satellite-integration
    paths:
      - agent_memory/swarm/coordination.json
  workflow_dispatch:
    inputs:
      mission:
        description: Optional coordination note
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  run-swarm:
    uses: ./.github/workflows/hixton-cloud-swarm-reusable.yml
    with:
      mission: ${{ inputs.mission || '15coin-slot-allocation-audit' }}
      base_branch: gpt/15coin-satellite-integration
