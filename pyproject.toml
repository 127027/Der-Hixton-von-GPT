[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "der-hixton"
version = "0.4.9"
description = "Deterministic Hixton VIDYA/ATR strategy, market-data and backtest foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.5",
  "tzdata==2026.3",
  "uvicorn==0.32.0",
  "websockets==12.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
hixton = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hixton.ui" = ["static/*.html", "static/assets/*.css", "static/assets/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
